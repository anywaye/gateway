version: 1
service: gateway

# account_scope.yml — every entry point `gateway` mounts, and which of them can
# reach another account's data.
#
# Checked by cafaye/core's contract harness:
#
#     /Users/kaka/Code/any/moon/cafaye/core/harness/bin/account-scope-check .
#
# `gateway` holds NO customer rows: `kit/reports/tenant-adapter-ts-01/subject-audit.sh`
# sweeps every TypeScript service in the fleet for a driver import, a driver
# declaration and a `.sql` file and finds none in any of them. What it DOES hold
# is the caller's identity: gateway verifies the bearer token, puts the principal on
# the request context, keys the rate limiter by the account in it, and forwards.
#
# So this file is not empty and it is not all-false either: one route DOES resolve
# an account and return it, and it is declared as such — `me`, `accountScoped:
# true`, verified by this run and not by this prose. Read the block above that row
# before reading this as a complete enumeration: the OTHER registration of that
# same route, the one `internal/api/api.gen.go` mounts, has no row and is why this
# run is red.
#
# TWO FILES, AND WHY THE SECOND ONE IS A GENERATED FILE WITH A HAND-EDITED LINE
# IN IT.
#
# gateway is mid-rewrite: `src/` is the TypeScript REFERENCE and `internal/api`
# is the Go implementation that will replace it, and both are live. So both
# register routes, and a declaration that names only one of them is declaring
# half the surface.
#
# THE GO FILE NEEDS A WORD, because `oapi-codegen` emits
#
#     r.Get(options.BaseURL+"/v1/me", wrapper.GetCurrentPrincipal)
#
# and core's chi recogniser requires a `/`-prefixed string literal as the FIRST
# term after `(`. Concatenation is resolved in the other direction — a literal, a
# `+`, then more — because identity's own router writes paths that way. So every
# generated registration is INVISIBLE, `route_defs` reads 0 over a surface the
# checker saw none of, and 0 over nothing prints exactly like 0 over everything.
#
# `internal/api/stripbaseurl` removes the token as the second `//go:generate`
# line, and `bin/prime-go` fails if a registration whose path is an expression
# reaches the committed file. That is why the `minimum` below is a number and
# not zero: pantry's is 0 with a DECISION NEEDED attached, because the same
# problem there could not be solved without a checker change.
#
# `surface.minimum: 14` IS THE HONEST COUNT and it is NOT lowered to hide the
# missing row. A floor set below the truth is a floor that stops being a floor,
# and `undeclared` is decided by the REGISTRATIONS in the source, never by this
# file's row count — so lowering it would buy nothing and cost the only
# decrease-detector this surface has.
#
# `14 = 7 + 7`: the same seven operations, registered twice, once by each
# implementation. That is not double-counting, it is two entry points that exist
# until the packet that deletes `src/`. When `src/` goes, its source comes out of
# this list, the seven rows below that name it go with it, and `minimum` returns
# to 7 — in that commit, because a floor that has to be lowered later is a floor
# somebody will forget.
surface:
  kind: http
  # The TypeScript file. Every route in `src/index.ts` is registered on the `app`
  # this one function builds, and naming the directory instead would drag in the
  # 40-odd `_test.ts` files beside it — where `route_defs` counts and D18's three
  # different answers came from.
  #
  # The Go file. The generated registrations, after `stripbaseurl` — see above for
  # why that step exists and why the gate holds it. Naming
  # `internal/api/api.gen.go` and not `internal/` also keeps the checker out of
  # `internal/httpapi`, where `route_defs` would count the test files' helpers.
  sources:
    - internal/api/api.gen.go
  # 7: the seven operations the generated file registers, and nothing else.
  # MEASURED, not chosen and not counted by hand — this is the count the checker
  # reads out of the one declared source, in the run at the bottom of this comment:
  #
  #     $ /Users/kaka/Code/any/moon/cafaye/core/harness/bin/account-scope-check .
  #     the declared sources register 7 entry point(s) and surface.minimum is 7
  #
  # and those seven are the seven `r.Get`/`r.Post` lines of
  # `internal/api/api.gen.go` — 1185, 1188, 1191, 1194, 1197, 1200, 1203 — every
  # one of which this commit re-verified by grep against the file rather than
  # carrying forward the number the file already had.
  #
  # IT WAS 14, AND THE DROP TO 7 IS THE DROP PREDICTED IN THE HEADER. `14 = 7 + 7`
  # was the same seven operations registered twice, once by `src/index.ts` and once
  # by `api.gen.go`, and `f87c891` deleted the TypeScript half. The seven rows that
  # named `src/index.ts` went with it, in the same commit, because that header said
  # they would and said why: "a floor that has to be lowered later is a floor
  # somebody will forget."
  #
  # THIS IS A LOWERING, and it is worth being explicit that it is not the other
  # kind. It is not a floor lowered to stop asking a question: the finding it
  # removes is `surface-thin`, which fired only because the declared sources could
  # be read at all once `src/index.ts` stopped being named. The number is what one
  # declared source actually registers, and `undeclared` is decided by the
  # REGISTRATIONS in the source rather than by this file's row count, so a floor
  # set below the truth buys nothing and costs the only decrease-detector this
  # surface has.
  #
  # HISTORY, kept because it is why this number is 7 and not 0. MEASURED, both
  # halves, in gateway-account-scope-ratchet-01:
  #
  #   with `options.BaseURL+` back in `api.gen.go` (reverted after measuring):
  #
  #     FAIL account-scope.surface-thin: the declared sources register 8 entry
  #     point(s) and surface.minimum is 14 — and 6 further registration(s) in
  #     those sources could not be read at all, so this floor is not being
  #     violated, it is unfalsifiable
  #     FAIL 0 account-scoped, 12 not-account-scoped, 0 stale, 1 undeclared,
  #          6 unreadable
  #
  #   with it removed — the shape f87c891 left behind, and the shape this floor is
  #   still standing on today:
  #
  #     FAIL 0 account-scoped, 12 not-account-scoped, 0 stale, 2 undeclared,
  #          0 unreadable
  #
  # So the number that moved there was `unreadable: 6 -> 0`, and what disappeared was
  # `surface-thin`. Core's own words about the FIRST shape — "this floor is not
  # being violated, it is unfalsifiable" — are the reason `internal/api/stripbaseurl`
  # exists and the reason `bin/prime-go` fails on a committed file that has
  # regressed to it. That property still holds of the committed file today, which
  # is what makes 7 a floor rather than a zero.
  minimum: 7
  accountKey: account_id

entryPoints:
  # --- the same seven, registered by the GO implementation ---------------------
  # Seven rows for seven generated registrations, and they exist for one reason:
  # `account-scope.undeclared` is decided by the REGISTRATIONS in the files
  # `surface.sources` names, not by this file's row count. Naming
  # `internal/api/api.gen.go` as a source therefore makes its seven registrations
  # countable — which is the point, and the whole reason `stripbaseurl` exists —
  # and countable registrations with no rows behind them are seven FAILURES.
  #
  # The measurements, so a reader can check rather than believe:
  #
  #   before this block:  8 undeclared, 7 of them the Go registrations
  #   after:              1 undeclared,  which is the pre-existing `GET /v1/me`
  #                       finding above and is not this block's to fix
  #
  # `registeredAt.line` WILL MOVE whenever `api.gen.go` is regenerated, and the
  # checker's `account-scope.stale` is what says so. That is the mechanism and it
  # is loud: the line numbers are the only thing in this file that cannot be
  # derived, and they are checked by the same run that checks everything else.
  - id: go-healthz
    kind: http
    method: GET
    path: /healthz
    accountScoped: false
    reason: public
    registeredAt:
      file: internal/api/api.gen.go
      line: 1185

  - id: go-readyz
    kind: http
    method: GET
    path: /readyz
    accountScoped: false
    reason: public
    registeredAt:
      file: internal/api/api.gen.go
      line: 1188

  # `GET /v1/me` HAS NO ROW HERE, AND IT IS STILL THE HONEST ANSWER — BUT THE
  # REASON IS NOW MEASURED RATHER THAN ASSUMED, and the earlier reason was wrong.
  #
  # `gateway-go-substrate-01` wrote this off as "a finding about the FORMAT": a row
  # is matched to a registration by (method, path) and NOT by the file its
  # `registeredAt` names, so with two implementations live one row lands on one
  # registration and the other reads as uncovered. That half is still true, and
  # `registeredAt` is still only what `account-scope.stale` reads. But "one row"
  # was the wrong conclusion drawn from it: TWO rows for the same (method, path)
  # are two claims the checker takes to two registrations, because `classify`
  # marks each registration taken and scans for the next untaken one. So the
  # format CAN say "this file registers it that way and that file registers it
  # this way", and `me` above is the proof: it took src/index.ts:278 and the chi
  # registration is still there to be covered.
  #
  # SO THE REMAINING BLOCKER IS NOT THE FORMAT. It is that neither honest answer
  # survives a run, and both were measured rather than argued:
  #
  #   accountScoped: false, reason: none
  #     ->  0 findings. `GetCurrentPrincipal` calls `notBuilt` and writes the v0
  #         404, so the route resolves no account today and the row is TRUE. It
  #         is also a claim NOTHING CAN REFUTE, and that is the reason it is not
  #         written. Measured: `handler_for` resolves every `wrapper.X` on these
  #         seven lines to `internal/api/api.gen.go` — the forwarding method in
  #         the generated wrapper — and `_hops` from that file is `[]`, so
  #         `contradiction` reads api.gen.go and one hop below it and NEVER
  #         opens `internal/httpapi/httpapi.go`, where the handler is. Five
  #         mutations of `GetCurrentPrincipal` were planted and reverted — an
  #         exported `principal.AccountID`, an unexported `principal.account`, a
  #         `payload["account_id"]` claim read, an inline principal — and NONE of
  #         them produced a finding on this row. A `false` nobody can refute on
  #         the one route this file exists to describe is the permissive direction
  #         the packet names: the fleet would believe a route is unscoped when the
  #         day comes that it is not.
  #
  #   accountScoped: true, accountFrom.via: requireJwt
  #     ->  FAIL account-scope.scoping-bypassed: go-me: registered at
  #         internal/api/api.gen.go:1191, which does not go through requireJwt.
  #         TRUE today — the Go router mounts all seven operations behind nothing,
  #         and `openapi/v1.yaml` gives `/v1/me` a `security:` block. It is also
  #         PERMANENT: `chain_gate` looks for `app.use(`/`.use(` and chi mounts
  #         middleware with `r.Use(`, so no middleware added to the Go router can
  #         ever satisfy it and the failure cannot be cleared by doing the work.
  #         A ratchet row red forever with a condition whose end is unreachable is
  #         the switch rule 2 exists to refuse.
  #
  # `accountScope.undeclared` is what answers instead, and it is TRUE and it is
  # ACTIONABLE: a registration in a file this declaration names, which no row
  # covers, and the packet that ports the bearer gate to `internal/httpapi` has to
  # write this row to go green. That is the difference from the previous state and
  # it is the reason this block is one line shorter than it was: BEFORE this
  # packet the TypeScript registration was undeclared too, so the route was
  # uncovered twice over. Now it is declared and verified, and exactly ONE
  # `undeclared` remains, naming the Go registration.
  #
  # > DECISION NEEDED (gateway-account-scope-ratchet-01), and it is NOT the one
  # > gateway-go-substrate-01 recorded. That one asked for `registeredAt` to become
  # > part of the match, and the answer is that it does not need to. What is needed
  # > is a way for `handler_for` to follow a GENERATED forwarding method to the
  # > implementation behind it: `wrapper.GetCurrentPrincipal` is a five-line
  # > trampoline in `api.gen.go` and the behaviour is in
  # > `internal/httpapi/httpapi.go`, and one hop cannot cross a package boundary
  # > that has no import statement to cross. Until then EVERY `go-*` row in this
  # > file is verified against the generated file and not against the code it
  # > describes — which is harmless today, because `internal/httpapi` contains no
  # > account evidence at all (measured: `evidence_in` over the masked file
  # > returns `None`), and is a silent hole the day it does. That is a defect in
  # > `core` and this repository is not the place to fix it; it is recorded in
  # > REPORT-gateway-account-scope-ratchet-01.md §6 with the measurement.
  #
  # What this block does NOT do is delete a row, lower `minimum`, or remove
  # `internal/api/api.gen.go` from `surface.sources` to make the number smaller.
  # All three would turn a visible finding into a green.

  - id: go-bff-register
    kind: http
    method: POST
    path: /auth/register
    accountScoped: false
    reason: public
    registeredAt:
      file: internal/api/api.gen.go
      line: 1194

  - id: go-bff-login
    kind: http
    method: POST
    path: /auth/login
    accountScoped: false
    reason: public
    registeredAt:
      file: internal/api/api.gen.go
      line: 1197

  - id: go-bff-logout
    kind: http
    method: POST
    path: /auth/logout
    accountScoped: false
    reason: public
    registeredAt:
      file: internal/api/api.gen.go
      line: 1200

  - id: go-bff-me
    kind: http
    method: GET
    path: /auth/me
    accountScoped: false
    reason: none
    registeredAt:
      file: internal/api/api.gen.go
      line: 1203
