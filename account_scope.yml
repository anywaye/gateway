version: 1
service: gateway

# account_scope.yml — every entry point `gateway` mounts, and which of them can
# reach another account's data.
#
# Checked by cafaye/core's contract harness:
#
#     /Users/kaka/Code/any/moon/cafaye/core/harness/bin/account-scope-check .
#
# `gateway` holds NO customer rows: `kit/reports/tenant-adapter-ts-01/subject-audit.sh`
# sweeps every TypeScript service in the fleet for a driver import, a driver
# declaration and a `.sql` file and finds none in any of them. What it DOES hold
# is the caller's identity: gateway verifies the bearer token, puts the principal on
# the request context, keys the rate limiter by the account in it, and forwards.
#
# So this file is not empty and it is not all-false either: one route DOES resolve
# an account and return it, and it is declared as such — `me`, `accountScoped:
# true`, verified by this run and not by this prose. Read the block above that row
# before reading this as a complete enumeration: the OTHER registration of that
# same route, the one `internal/api/api.gen.go` mounts, has no row and is why this
# run is red.
#
# TWO FILES, AND WHY THE SECOND ONE IS A GENERATED FILE WITH A HAND-EDITED LINE
# IN IT.
#
# gateway is mid-rewrite: `src/` is the TypeScript REFERENCE and `internal/api`
# is the Go implementation that will replace it, and both are live. So both
# register routes, and a declaration that names only one of them is declaring
# half the surface.
#
# THE GO FILE NEEDS A WORD, because `oapi-codegen` emits
#
#     r.Get(options.BaseURL+"/v1/me", wrapper.GetCurrentPrincipal)
#
# and core's chi recogniser requires a `/`-prefixed string literal as the FIRST
# term after `(`. Concatenation is resolved in the other direction — a literal, a
# `+`, then more — because identity's own router writes paths that way. So every
# generated registration is INVISIBLE, `route_defs` reads 0 over a surface the
# checker saw none of, and 0 over nothing prints exactly like 0 over everything.
#
# `internal/api/stripbaseurl` removes the token as the second `//go:generate`
# line, and `bin/prime-go` fails if a registration whose path is an expression
# reaches the committed file. That is why the `minimum` below is a number and
# not zero: pantry's is 0 with a DECISION NEEDED attached, because the same
# problem there could not be solved without a checker change.
#
# `surface.minimum: 14` IS THE HONEST COUNT and it is NOT lowered to hide the
# missing row. A floor set below the truth is a floor that stops being a floor,
# and `undeclared` is decided by the REGISTRATIONS in the source, never by this
# file's row count — so lowering it would buy nothing and cost the only
# decrease-detector this surface has.
#
# `14 = 7 + 7`: the same seven operations, registered twice, once by each
# implementation. That is not double-counting, it is two entry points that exist
# until the packet that deletes `src/`. When `src/` goes, its source comes out of
# this list, the seven rows below that name it go with it, and `minimum` returns
# to 7 — in that commit, because a floor that has to be lowered later is a floor
# somebody will forget.
surface:
  kind: http
  # The TypeScript file. Every route in `src/index.ts` is registered on the `app`
  # this one function builds, and naming the directory instead would drag in the
  # 40-odd `_test.ts` files beside it — where `route_defs` counts and D18's three
  # different answers came from.
  #
  # The Go file. The generated registrations, after `stripbaseurl` — see above for
  # why that step exists and why the gate holds it. Naming
  # `internal/api/api.gen.go` and not `internal/` also keeps the checker out of
  # `internal/httpapi`, where `route_defs` would count the test files' helpers.
  sources:
    - internal/api/api.gen.go
  # 7: the seven operations the generated file registers, and nothing else.
  # MEASURED, not chosen and not counted by hand — this is the count the checker
  # reads out of the one declared source, in the run at the bottom of this comment:
  #
  #     $ /Users/kaka/Code/any/moon/cafaye/core/harness/bin/account-scope-check .
  #     the declared sources register 7 entry point(s) and surface.minimum is 7
  #
  # and those seven are the seven `r.Get`/`r.Post` lines of
  # `internal/api/api.gen.go` — 1185, 1188, 1191, 1194, 1197, 1200, 1203 — every
  # one of which this commit re-verified by grep against the file rather than
  # carrying forward the number the file already had.
  #
  # IT WAS 14, AND THE DROP TO 7 IS THE DROP PREDICTED IN THE HEADER. `14 = 7 + 7`
  # was the same seven operations registered twice, once by `src/index.ts` and once
  # by `api.gen.go`, and `f87c891` deleted the TypeScript half. The seven rows that
  # named `src/index.ts` went with it, in the same commit, because that header said
  # they would and said why: "a floor that has to be lowered later is a floor
  # somebody will forget."
  #
  # THIS IS A LOWERING, and it is worth being explicit that it is not the other
  # kind. It is not a floor lowered to stop asking a question: the finding it
  # removes is `surface-thin`, which fired only because the declared sources could
  # be read at all once `src/index.ts` stopped being named. The number is what one
  # declared source actually registers, and `undeclared` is decided by the
  # REGISTRATIONS in the source rather than by this file's row count, so a floor
  # set below the truth buys nothing and costs the only decrease-detector this
  # surface has.
  #
  # HISTORY, kept because it is why this number is 7 and not 0. MEASURED, both
  # halves, in gateway-account-scope-ratchet-01:
  #
  #   with `options.BaseURL+` back in `api.gen.go` (reverted after measuring):
  #
  #     FAIL account-scope.surface-thin: the declared sources register 8 entry
  #     point(s) and surface.minimum is 14 — and 6 further registration(s) in
  #     those sources could not be read at all, so this floor is not being
  #     violated, it is unfalsifiable
  #     FAIL 0 account-scoped, 12 not-account-scoped, 0 stale, 1 undeclared,
  #          6 unreadable
  #
  #   with it removed — the shape f87c891 left behind, and the shape this floor is
  #   still standing on today:
  #
  #     FAIL 0 account-scoped, 12 not-account-scoped, 0 stale, 2 undeclared,
  #          0 unreadable
  #
  # So the number that moved there was `unreadable: 6 -> 0`, and what disappeared was
  # `surface-thin`. Core's own words about the FIRST shape — "this floor is not
  # being violated, it is unfalsifiable" — are the reason `internal/api/stripbaseurl`
  # exists and the reason `bin/prime-go` fails on a committed file that has
  # regressed to it. That property still holds of the committed file today, which
  # is what makes 7 a floor rather than a zero.
  minimum: 7
  accountKey: account_id

entryPoints:
  # --- THE ONE ACCOUNT-SCOPED ROW, AND THE ONE THAT IS PERMANENTLY RED ---------
  # `GET /v1/me` resolves an account and returns it. It is the ONLY row here with
  # `accountScoped: true`, and the only route in gateway that can reach another
  # account's data: everything else resolves a USER, a session, or nothing at all.
  #
  # IT IS RED, AND IT STAYS RED, AND NEITHER OF THOSE IS A DEFECT IN THE ROW. Read
  # this block before "fixing" it. The finding is
  #
  #   FAIL account-scope.scoping-bypassed: me: registered at
  #        internal/api/api.gen.go:1191, which does not go through Authenticate
  #
  # and it is PERMANENT for a reason that has nothing to do with whether this route
  # is actually scoped. It is scoped. Here is the chain, every line measured:
  #
  #   internal/httpapi/httpapi.go:302
  #       router.Use(everyRequest(insideLimiter, bearerGate(options))...)
  #   internal/httpapi/httpapi.go:429-434   bearerGate
  #       onPrefix("/v1/", options.Verifier.Require(writeAuthRefusal))
  #   internal/httpapi/httpapi.go:575-586   onPrefix gates on
  #       strings.HasPrefix(r.URL.Path, "/v1/")  -> "/v1/me" matches
  #   internal/auth/middleware.go:102        (*Verifier).Require
  #       next.ServeHTTP(w, withPrincipal(r, principal))
  #   internal/auth/verifier.go:540-541      Authenticate resolves the account
  #       principal.AccountID = &account     from claims.String("account_id")
  #   internal/httpapi/principal.go:66       the handler reads it back
  #       principal := auth.PrincipalOf(r)
  #
  # ## THE CHI TRAP IS NOT TRIPPED HERE, AND IT WAS CHECKED RATHER THAN ASSUMED
  #
  # This repository already shipped the routed-traffic defect: chi's `Use` wraps
  # only the routes registered on THAT router after the `Use`, so a gate mounted
  # after `api.HandlerWithOptions` would guard nothing. The order here is
  # `router.Use` at 302 and `api.HandlerWithOptions` at 305 — the `Use` is
  # ABOVE the registration, which is the only order that works. That is the whole
  # argument, and it is why `internal/httpapi/principal.go:68` can say "unreachable
  # while `Require` is mounted above this route on `/v1/*`" and mean it.
  #
  # ## WHY `chain_gate` CANNOT SEE ANY OF THAT, MEASURED
  #
  # Three facts about core's `chain_gate`, each read out of
  # `harness/account_scope_check.py` and then confirmed by running it:
  #
  #   1. It reads ONE file — the one `registeredAt` names (`chain_gate` opens
  #      `source_lines(within(repo, where))`). Here that is `api.gen.go`.
  #   2. `MIDDLEWARE` is
  #        \b(?:app|router|api|r|server)\.use\(...
  #      lowercase `use`, compiled WITHOUT `re.IGNORECASE`. chi's mount is
  #      `router.Use(`. It cannot match.
  #   3. `api.gen.go` contains no `.use(` at all, so even case-insensitively there
  #      is nothing for it to find.
  #
  #   $ python3 -c "...checker's own MIDDLEWARE and chain_gate..."
  #     MIDDLEWARE matches httpapi.go:302 the real gate    -> False
  #     MIDDLEWARE matches r.use("/v1/*", requireJwt(...))  -> True
  #     MIDDLEWARE hits in api.gen.go (the registeredAt file): []
  #     chain_gate(api.gen.go, 1191, /v1/me, via=Authenticate)
  #       -> Chain(covers=False, composed=False, at=None)
  #
  # `covers=False` with `composed=False` is the one shape that both fails the gate
  # AND claims the chain was followed, so `readable` stays True and
  # `scoping-bypassed` fires. And `registeredAt` cannot move to dodge this: it has
  # to name a line that REGISTERS the route or `account-scope.stale` fires instead,
  # and `r.Get("/v1/me", wrapper.GetCurrentPrincipal)` at `api.gen.go:1191` is the
  # only such line in the repository. `internal/httpapi` registers the seven
  # through `api.HandlerWithOptions`, which carries no path.
  #
  # So: a ratchet row red forever with a condition whose end is unreachable. The
  # file's own rule 2 refuses that shape — and the fix is in CORE (make MIDDLEWARE
  # read `Use(`, or let `chain_gate` follow the registration's package), not here.
  # Nothing in gateway can clear it, and inventing a lowercase `.use(` line in
  # `api.gen.go` to satisfy the regex would be a fake gate, which is worse than
  # the red.
  #
  # ## WHY IT IS NOT `accountScoped: false`, WHICH PASSES
  #
  # Measured, both rows, same tree:
  #
  #   this row (`true`)  -> FAIL ... 1 account-scoped, 6 not-account-scoped,
  #                         0 stale, 0 undeclared, 0 unreadable — 1 failure(s),
  #                         0 warning(s)          EXIT 1
  #   `false, reason: none`
  #                      -> OK   ... 0 account-scoped, 7 not-account-scoped,
  #                         0 stale, 0 undeclared, 0 unreadable — 0 failure(s),
  #                         1 warning(s)          EXIT 0
  #
  # `false` goes green and it is WRONG. The route resolves an account — the chain
  # above is nine lines long and none of them is hypothetical — so `false` is a
  # false statement about gateway's only account-scoped route. Worse, it is one
  # nothing can refute: `handler_for` resolves `wrapper.GetCurrentPrincipal` to
  # the forwarding trampoline in `api.gen.go` and `_hops` from there is `[]`, so
  # the checker never opens `internal/httpapi/principal.go`, where the behaviour
  # is. Five mutations of that handler were planted and reverted by
  # gateway-account-scope-ratchet-01 and NONE produced a finding. A `false`
  # nobody can refute is the permissive direction: the fleet would believe a route
  # is unscoped the day it is not. This row is `true` and red because a red that
  # says the true thing is worth more than a green that says the opposite.
  #
  # WHAT IS CHECKED, and checked by the run above rather than asserted here:
  # `account-scope.account-key-lost` fires on `accountFrom` and does NOT fire —
  # `internal/auth/verifier.go:541` carries the account key, and `Authenticate`
  # appears in the file `accountFrom` names, which is the second thing that check
  # asks and the one that made the first attempt (`via: bearerGate`, named in
  # `internal/httpapi` and not in `internal/auth`) fail with `account-key-lost`
  # alongside `scoping-bypassed`. Measured, not guessed.
  - id: me
    kind: http
    method: GET
    path: /v1/me
    accountScoped: true
    accountFrom: { via: Authenticate, file: internal/auth/verifier.go, line: 541 }
    registeredAt:
      file: internal/api/api.gen.go
      line: 1191

  # --- the same seven, registered by the GO implementation ---------------------
  # Seven rows for seven generated registrations, and they exist for one reason:
  # `account-scope.undeclared` is decided by the REGISTRATIONS in the files
  # `surface.sources` names, not by this file's row count. Naming
  # `internal/api/api.gen.go` as a source therefore makes its seven registrations
  # countable — which is the point, and the whole reason `stripbaseurl` exists —
  # and countable registrations with no rows behind them are seven FAILURES.
  #
  # The measurements, so a reader can check rather than believe:
  #
  #   before this block:  8 undeclared, 7 of them the Go registrations
  #   after:              1 undeclared,  which is the pre-existing `GET /v1/me`
  #                       finding above and is not this block's to fix
  #
  # `registeredAt.line` WILL MOVE whenever `api.gen.go` is regenerated, and the
  # checker's `account-scope.stale` is what says so. That is the mechanism and it
  # is loud: the line numbers are the only thing in this file that cannot be
  # derived, and they are checked by the same run that checks everything else.
  - id: go-healthz
    kind: http
    method: GET
    path: /healthz
    accountScoped: false
    reason: public
    registeredAt:
      file: internal/api/api.gen.go
      line: 1185

  - id: go-readyz
    kind: http
    method: GET
    path: /readyz
    accountScoped: false
    reason: public
    registeredAt:
      file: internal/api/api.gen.go
      line: 1188

  # HISTORY, AND TWO OF ITS CLAIMS ARE NOW FALSE. Read the `me` row above first;
  # this block is what the state was BEFORE that row was re-pointed at the Go
  # registration, and it is kept because the reasoning is what produced the row.
  #
  # IT USED TO SAY "`GET /v1/me` HAS NO ROW HERE", because with two
  # implementations live one row landed on one registration and the other read as
  # uncovered. That is gone: `me` now names `internal/api/api.gen.go:1191` and the
  # row above is the one that carries the `scoping-bypassed` finding.
  #
  # The FORMAT half of the old reasoning was right and is still true. A row is
  # matched to a registration by (method, path) and NOT by the file its
  # `registeredAt` names; `registeredAt` is only what `account-scope.stale` reads.
  # What was WRONG was the conclusion drawn from it — that this was unfixable "in
  # the format". Two rows for one (method, path) are two claims taken to two
  # registrations, because `classify` marks each registration taken and scans for
  # the next untaken one. With `src/` gone there is only one implementation, so
  # the ambiguity the format question was about no longer arises at all.
  #
  # TWO CLAIMS IN THE OLD BLOCK ARE FALSE AS OF THIS COMMIT, and both were false
  # before this commit wrote them down:
  #
  #   "`GetCurrentPrincipal` calls `notBuilt` and writes the v0 404, so the route
  #    resolves no account today." — NO. `internal/httpapi/principal.go:60` reads
  #    `auth.PrincipalOf(r)` and renders it. The v0 404 at line 62 is the
  #    `s.verifier == nil` case and nothing else.
  #
  #   "the Go router mounts all seven operations behind nothing" — NO.
  #    `internal/httpapi/httpapi.go:302` mounts `bearerGate` over `/v1/`, above
  #    the registration at 305. See the chain in the `me` row.
  #
  # The conclusion those claims supported is unchanged and is still the reason
  # `me` is `true` and red: `accountScoped: false` would go GREEN and would be
  # WRONG, and it is a claim nothing can refute, because `handler_for` resolves
  # `wrapper.GetCurrentPrincipal` to the forwarding trampoline in `api.gen.go`
  # and `_hops` from there is `[]`, so the checker never opens the file the
  # behaviour is in. Five mutations of that handler were planted and reverted by
  # gateway-account-scope-ratchet-01 and NONE of them produced a finding.
  #
  # > DECISION NEEDED (gateway-account-scope-ratchet-01 §6), UNCHANGED AND STILL
  # > OPEN, and it is in `core` and not here: `handler_for` needs to be able to
  # > follow a GENERATED forwarding method to the implementation behind it.
  # > `wrapper.GetCurrentPrincipal` is a five-line trampoline in `api.gen.go` and
  # > the behaviour is in `internal/httpapi/principal.go`, and one hop cannot
  # > cross a package boundary with no import statement to cross. Until then every
  # > `go-*` row below is verified against the generated file rather than against
  # > the code it describes.
  #
  # A SECOND core defect is now measured too, and it is the one that keeps `me`
  # red: `MIDDLEWARE` cannot read chi's `Use(`. That measurement, and the run that
  # produced it, are in the `me` row rather than repeated here.
  #
  # What this block does NOT do is delete a row, lower `minimum`, or remove
  # `internal/api/api.gen.go` from `surface.sources` to make the number smaller.
  # All three would turn a visible finding into a green.

  - id: go-bff-register
    kind: http
    method: POST
    path: /auth/register
    accountScoped: false
    reason: public
    registeredAt:
      file: internal/api/api.gen.go
      line: 1194

  - id: go-bff-login
    kind: http
    method: POST
    path: /auth/login
    accountScoped: false
    reason: public
    registeredAt:
      file: internal/api/api.gen.go
      line: 1197

  - id: go-bff-logout
    kind: http
    method: POST
    path: /auth/logout
    accountScoped: false
    reason: public
    registeredAt:
      file: internal/api/api.gen.go
      line: 1200

  - id: go-bff-me
    kind: http
    method: GET
    path: /auth/me
    accountScoped: false
    reason: none
    registeredAt:
      file: internal/api/api.gen.go
      line: 1203
