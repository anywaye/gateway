version: 1
service: gateway

# account_scope.yml — every entry point `gateway` mounts, and which of them can
# reach another account's data.
#
# Checked by cafaye/core's contract harness:
#
#     /Users/kaka/Code/any/moon/cafaye/core/harness/bin/account-scope-check .
#
# `gateway` holds NO customer rows: `kit/reports/tenant-adapter-ts-01/subject-audit.sh`
# sweeps every TypeScript service in the fleet for a driver import, a driver
# declaration and a `.sql` file and finds none in any of them. What it DOES hold
# is the caller's identity: gateway verifies the bearer token, puts the principal on
# the request context, keys the rate limiter by the account in it, and forwards.
#
# So this file is not empty and it is not all-false either: one route DOES resolve
# an account and return it, and that route is the one this file cannot declare.
# Read the block above the browser-surface rows before reading this as a
# complete enumeration.
#
# TWO FILES, AND WHY THE SECOND ONE IS A GENERATED FILE WITH A HAND-EDITED LINE
# IN IT.
#
# gateway is mid-rewrite: `src/` is the TypeScript REFERENCE and `internal/api`
# is the Go implementation that will replace it, and both are live. So both
# register routes, and a declaration that names only one of them is declaring
# half the surface.
#
# THE GO FILE NEEDS A WORD, because `oapi-codegen` emits
#
#     r.Get(options.BaseURL+"/v1/me", wrapper.GetCurrentPrincipal)
#
# and core's chi recogniser requires a `/`-prefixed string literal as the FIRST
# term after `(`. Concatenation is resolved in the other direction — a literal, a
# `+`, then more — because identity's own router writes paths that way. So every
# generated registration is INVISIBLE, `route_defs` reads 0 over a surface the
# checker saw none of, and 0 over nothing prints exactly like 0 over everything.
#
# `internal/api/stripbaseurl` removes the token as the second `//go:generate`
# line, and `bin/prime-go` fails if a registration whose path is an expression
# reaches the committed file. That is why the `minimum` below is a number and
# not zero: pantry's is 0 with a DECISION NEEDED attached, because the same
# problem there could not be solved without a checker change.
#
# `surface.minimum: 14` IS THE HONEST COUNT and it is NOT lowered to hide the
# missing row. A floor set below the truth is a floor that stops being a floor,
# and `undeclared` is decided by the REGISTRATIONS in the source, never by this
# file's row count — so lowering it would buy nothing and cost the only
# decrease-detector this surface has.
#
# `14 = 7 + 7`: the same seven operations, registered twice, once by each
# implementation. That is not double-counting, it is two entry points that exist
# until the packet that deletes `src/`. When `src/` goes, its source comes out of
# this list, the seven rows below that name it go with it, and `minimum` returns
# to 7 — in that commit, because a floor that has to be lowered later is a floor
# somebody will forget.
surface:
  kind: http
  # The TypeScript file. Every route in `src/index.ts` is registered on the `app`
  # this one function builds, and naming the directory instead would drag in the
  # 40-odd `_test.ts` files beside it — where `route_defs` counts and D18's three
  # different answers came from.
  #
  # The Go file. The generated registrations, after `stripbaseurl` — see above for
  # why that step exists and why the gate holds it. Naming
  # `internal/api/api.gen.go` and not `internal/` also keeps the checker out of
  # `internal/httpapi`, where `route_defs` would count the test files' helpers.
  sources:
    - src/index.ts
    - internal/api/api.gen.go
  # 14: the seven operations in the TypeScript file and the same seven in the
  # generated one. The assertion packet added NO registration — it did not need
  # one, and an added route is what would have forced this `minimum` to move. See
  # `principal` in `src/routes/table.ts`: the public half of gateway's assertion
  # key is exposed through the minter rather than at `/.well-known/jwks.json`,
  # precisely so this file does not change.
  #
  # MEASURED, not counted by hand, and both halves measured rather than one:
  #
  #     $ /Users/kaka/Code/any/moon/cafaye/core/harness/bin/account-scope-check .
  #
  #   with `options.BaseURL+` back in `api.gen.go` (all seven registrations, one
  #   command, reverted after measuring):
  #
  #     FAIL account-scope.surface-thin: the declared sources register 8 entry
  #     point(s) and surface.minimum is 14 — and 6 further registration(s) in
  #     those sources could not be read at all, so this floor is not being
  #     violated, it is unfalsifiable
  #     FAIL 0 account-scoped, 12 not-account-scoped, 0 stale, 1 undeclared,
  #          6 unreadable
  #
  #   with it removed (the committed state):
  #
  #     FAIL 0 account-scoped, 12 not-account-scoped, 0 stale, 2 undeclared,
  #          0 unreadable
  #
  # So the number that moves is `unreadable: 6 -> 0` and the finding that
  # disappears is `surface-thin`. Note what core says about the FIRST shape:
  # "this floor is not being violated, it is unfalsifiable" — a floor the checker
  # can tell is blind is worse than a floor set too low, because it looks like a
  # passing floor. That is why `stripbaseurl` exists and why `bin/prime-go` fails
  # on a committed file that has regressed to it.
  minimum: 14
  accountKey: account_id

entryPoints:
  # --- the two probes -------------------------------------------------------
  # Liveness is unconditional and touches nothing; a dependency outage must not
  # get the process restarted out from under in-flight requests.
  - id: healthz
    kind: http
    method: GET
    path: /healthz
    accountScoped: false
    reason: public
    registeredAt:
      file: src/index.ts
      line: 157

  - id: readyz
    kind: http
    method: GET
    path: /readyz
    accountScoped: false
    reason: public
    registeredAt:
      file: src/index.ts
      line: 159

  # --- THE ONE ENTRY POINT THIS DECLARATION CANNOT CONTAIN -------------------
  # `GET /v1/me` (src/index.ts:247) resolves an account and returns it, and BOTH
  # of the ways to say so are answered by a FAILURE. Measured, not reasoned:
  #
  #   accountScoped: true, accountFrom.via: requireJwt,
  #   file src/middleware/jwt.ts, line 346
  #                 ->  FAIL account-scope.scoping-bypassed
  #                     "registered at src/index.ts:247, which does not go
  #                      through requireJwt"
  #
  #   accountScoped: false, reason: public
  #                 ->  FAIL account-scope.declaration-contradicts-code
  #                     "the registration line itself resolves an account, in an
  #                      inline handler: app.get("/v1/me", (c) =>
  #                      c.json(c.get("principal")));"
  #
  # BOTH ARE FALSE ON THIS ROUTE, and the reason is Hono's registration order.
  # The JWT gate is `app.use("/v1/*", ...)` at src/index.ts:219 — TWENTY-EIGHT
  # LINES ABOVE the route — and Hono answers in registration order, so a route
  # registered after a `use` IS behind it. The file's own comment at
  # src/index.ts:197 says so: "Hono matches handlers in registration order and a
  # route registered before a `use` answers first and never calls `next`." The
  # registration line therefore says NOTHING about whether the route is scoped.
  #
  # core reaches the same conclusion about two other frameworks for the same
  # reason. `Recogniser.carries_handler` is False for Phoenix and axum precisely
  # because "for those two the route's own line says nothing about scoping, and
  # reporting it would report courier's real router as unscoped — a rule that
  # cries wolf on correct code is the same defect as one that stays quiet on
  # broken code." A Hono route with an INLINE handler is the third member of that
  # set and is not in it, which is why `scoping-bypassed` fires here and would
  # not fire on a `bff.me`-style route whose handler is a bare reference.
  #
  # So the route is left OUT rather than declared wrong.
  # `account-scope.undeclared` is what answers, and it is TRUE: a registration in
  # a file this declaration names, which no row covers. That is the honest answer
  # and it is a finding for `core` — REPORT-identity-account-scope-01.md §6.7,
  # measured on this repository.
  # ---------------------------------------------------------------------------
  # The route, for the record:
  #
  #   GET /v1/me   src/index.ts:247   resolves the account at
  #                 src/middleware/jwt.ts:346 — `accountId: typeof
  #                 payload.account_id === "string" && payload.account_id !== ""
  #                 ? payload.account_id : undefined`, inside `principalOf` —
  #                 through the `requireJwt` gate at
  #                 src/middleware/jwt.ts:241, which is mounted on `/v1/*` at
  #                 src/index.ts:219.
  # ---------------------------------------------------------------------------

  # --- the browser surface --------------------------------------------------
  # Four routes, all reached through `createBffAuth`, and NONE of them resolves
  # an account: they resolve a USER. Register creates one, login authenticates one
  # and mints a session, logout ends one, and `me` returns the session's own user.
  # There is no account in the path of any of them, so there is nothing for a
  # caller to point at somebody else's.
  - id: bff-register
    kind: http
    method: POST
    path: /auth/register
    accountScoped: false
    reason: public
    registeredAt:
      file: src/index.ts
      line: 280

  - id: bff-login
    kind: http
    method: POST
    path: /auth/login
    accountScoped: false
    reason: public
    registeredAt:
      file: src/index.ts
      line: 281

  - id: bff-logout
    kind: http
    method: POST
    path: /auth/logout
    accountScoped: false
    reason: public
    registeredAt:
      file: src/index.ts
      line: 282

  - id: bff-me
    kind: http
    method: GET
    path: /auth/me
    accountScoped: false
    reason: none
    registeredAt:
      file: src/index.ts
      line: 283

  # --- the same seven, registered by the GO implementation ---------------------
  # Seven rows for seven generated registrations, and they exist for one reason:
  # `account-scope.undeclared` is decided by the REGISTRATIONS in the files
  # `surface.sources` names, not by this file's row count. Naming
  # `internal/api/api.gen.go` as a source therefore makes its seven registrations
  # countable — which is the point, and the whole reason `stripbaseurl` exists —
  # and countable registrations with no rows behind them are seven FAILURES.
  #
  # The measurements, so a reader can check rather than believe:
  #
  #   before this block:  8 undeclared, 7 of them the Go registrations
  #   after:              1 undeclared,  which is the pre-existing `GET /v1/me`
  #                       finding above and is not this block's to fix
  #
  # `registeredAt.line` WILL MOVE whenever `api.gen.go` is regenerated, and the
  # checker's `account-scope.stale` is what says so. That is the mechanism and it
  # is loud: the line numbers are the only thing in this file that cannot be
  # derived, and they are checked by the same run that checks everything else.
  - id: go-healthz
    kind: http
    method: GET
    path: /healthz
    accountScoped: false
    reason: public
    registeredAt:
      file: internal/api/api.gen.go
      line: 1185

  - id: go-readyz
    kind: http
    method: GET
    path: /readyz
    accountScoped: false
    reason: public
    registeredAt:
      file: internal/api/api.gen.go
      line: 1188

  # `GET /v1/me` HAS NO ROW HERE, AND THAT IS A FINDING ABOUT THE FORMAT RATHER
  # THAN ABOUT THIS REPOSITORY. It is measured:
  #
  #   $ /Users/kaka/Code/any/moon/cafaye/core/harness/bin/account-scope-check .
  #   FAIL account-scope.declaration-contradicts-code: go-me (GET /v1/me) is
  #   declared accountScoped: false … and the registration line itself resolves an
  #   account, in an inline handler … resolved account evidence at
  #   src/index.ts:247
  #   FAIL account-scope.undeclared: chi registers GET /v1/me at
  #   internal/api/api.gen.go:1191 … which no entry point covers
  #
  # A row is matched to a registration by (method, path) and NOT by the file its
  # `registeredAt` names — `registeredAt` is what `account-scope.stale` reads, and
  # nothing else. So with BOTH implementations live there are two registrations of
  # `GET /v1/me`, and declaring one row lands it on the TypeScript one — whose
  # inline handler `c.get("principal")` genuinely does resolve an account, which
  # is the finding documented at length above and the reason that row is omitted
  # there. The Go registration is then left undeclared, so declaring the row buys
  # one new failure and still does not cover the route.
  #
  # OMITTING IT IS THE HONEST ANSWER, and it costs one more `undeclared` than the
  # baseline: two registrations, no row, `account-scope.undeclared` names both, and
  # the route is visibly uncovered rather than declared wrong. `GET /v1/me` in
  # `internal/httpapi` resolves NO account today — `GetCurrentPrincipal` calls
  # `notBuilt` and writes the v0 `404` — so a truthful `accountScoped: false` would
  # be correct for the Go side alone; there is simply nowhere in the format to say
  # "for this one of the two".
  #
  # > DECISION NEEDED (gateway-go-substrate-01): a declaration row cannot be
  # > scoped to a file. Two implementations of one contract register the same
  # > (method, path) twice, `surface.sources` names both files so that `route_defs`
  # > is a real number rather than zero, and `undeclared` is decided by those
  # > registrations — so a route registered by both is matched to one row and the
  # > other reads as uncovered. Either `registeredAt` becomes part of the match, or
  # > the format grows a per-source way to say "this file registers what the rows
  # > below already declare". The rewrite is what makes this bite: it is the first
  # > period in this fleet's history where two implementations of one HTTP contract
  # > are live at once, and it is the last packet's job to delete one of them.
  #
  # What this packet does NOT do is delete a row, lower `minimum`, or remove
  # `internal/api/api.gen.go` from `surface.sources` to make the number smaller.
  # All three would turn a visible finding into a green.

  - id: go-bff-register
    kind: http
    method: POST
    path: /auth/register
    accountScoped: false
    reason: public
    registeredAt:
      file: internal/api/api.gen.go
      line: 1194

  - id: go-bff-login
    kind: http
    method: POST
    path: /auth/login
    accountScoped: false
    reason: public
    registeredAt:
      file: internal/api/api.gen.go
      line: 1197

  - id: go-bff-logout
    kind: http
    method: POST
    path: /auth/logout
    accountScoped: false
    reason: public
    registeredAt:
      file: internal/api/api.gen.go
      line: 1200

  - id: go-bff-me
    kind: http
    method: GET
    path: /auth/me
    accountScoped: false
    reason: none
    registeredAt:
      file: internal/api/api.gen.go
      line: 1203
