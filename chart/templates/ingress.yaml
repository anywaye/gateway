{{- if .Values.ingress.enabled }}
# Traefik is k3s's default ingress controller (DEPLOYMENT.md), so this is a
# plain Ingress with the traefik class — no IngressRoute CRD, no
# service-specific annotation language.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "gateway.fullname" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
  {{- if or .Values.ingress.annotations .Values.ingress.clusterIssuer }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    # The issuer annotation, only when a value is set (empty means no
    # cert-manager — a secret nothing writes) and the operator has not set
    # the same key in `ingress.annotations` above: a duplicate annotation
    # key is invalid YAML, so an explicit operator value wins.
    {{- if and .Values.ingress.clusterIssuer (not (hasKey (.Values.ingress.annotations | default dict) "cert-manager.io/cluster-issuer")) }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "gateway.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
