# values.yaml — gateway's launch deploy artifact.
#
# This file is the specification `caf gen chart` (packet L10) must reproduce:
# every value that belongs in a manifest is here, and nothing in the templates
# is a hand-typed constant a generator could not emit.
#
# WHAT THIS CHART IS: the deploy artifact for the anywaye front door, pulled by
# Argo from the OCI chart repository. The one Application is kit's —
# `templates/substrate/manifests/applications/gateway.yaml` (source
# `oci://ghcr.io/anywaye/charts`, chart `gateway`, targetRevision 0.1.0,
# destination namespace `gateway`, CreateNamespace=true). This repository's own
# copy (`deploy/argocd/gateway-application.yaml`) was deleted in packet
# gateway-w87: it collided with kit's by name and namespace, used a git source
# the OCI design rejects, and targeted a `anywaye` namespace no service uses.
# It is NOT a second deploy path: DEPLOYMENT.md is explicit that there is no
# helm-from-CI template in kit and one may never be added, because a second
# deploy path beside Argo is a split brain. The chart is pulled by Argo, or it
# does not run.
#
# WHAT IT IS NOT: not a Kamal config, not a compose stack, not a hosted
# platform. The customer brings the box; this is what runs on it.

image:
  # WITH the registry host, and the host is not decoration. A repository value
  # with no host is resolved by containerd against Docker Hub, so a bare
  # `anywaye/gateway` asks for `docker.io/anywaye/gateway` — not ours — and the
  # pod reaches image-pull and fails forever:
  #
  #     Failed to pull image "anywaye/gateway:0.1.0": ... pull access denied,
  #     repository does not exist or may require authorization
  #
  # The fleet's images live at `ghcr.io/<github.repository>` — kit's image
  # workflow derives the name from the repository and takes no input for it, so
  # this value is that derivation, not an independent choice — and every other
  # service's chart names it with the host (`ghcr.io/anywaye/identity`, …).
  # `bin/prime` fails the build if this value loses the host or stops naming the
  # published path; the check is at the publish step, beside the caller that
  # pushes the image.
  repository: ghcr.io/anywaye/gateway
  # THE REFERENCE, AND IT IS IMMUTABLE ON PURPOSE — the defect this field
  # exists to close was MEASURED, on the live box:
  #
  #     registry: ghcr.io/anywaye/gateway:0.1.0 → sha256:c2647050487…37165
  #     node:     ghcr.io/anywaye/gateway:0.1.0 → sha256:8e6059b012…e79b
  #
  # Two different digests, six hours after the Redis AUTH fix was merged,
  # published and READY IN THE REGISTRY. Nothing closed the gap, and both
  # reasons were structural: the `0.1.0` tag is a release constant overwritten
  # on every master push (`publish.reusable.yml` reads Chart.yaml's
  # appVersion and hands it to the image build), and the chart's text did not
  # change, so Argo's textual diff reported `Synced` with no rollout while
  # `imagePullPolicy: IfNotPresent` re-served the node's stale copy on every
  # restart. A mutable release tag is `latest` with a better-sounding name.
  #
  # A DIGEST cannot move. The Deployment renders
  # `repository@digest` whenever this field is set, and `repository:tag` when
  # it is not, so a new build is a textual diff Argo will actually sync, and
  # the pull policy no longer matters: the name names the bytes.
  #
  # WHO WRITES THIS FIELD: `chart.reusable.yml`, in the publish run, from the
  # digest of the image it just built (`publish.reusable.yml` hands it the
  # image job's build output) — so the OCI chart that lands in
  # `oci://ghcr.io/anywaye/charts/gateway:0.1.0` names the image the registry
  # holds beside it. The value committed here is the LAST PUBLISHED image,
  # which is what a `push: false` run packages and what `helm template` on a
  # fresh clone renders. `bin/prime-go` refuses this file with an empty or
  # malformed digest: the committed value is the pin a fresh clone renders,
  # so it must be real, and a chart that rendered `repository@nonsense` is a
  # pod in image-pull failure with nothing naming this field.
  #
  # THE COMMITTED VALUE, AND HOW FAST IT AGES. It is the digest
  # `ghcr.io/anywaye/gateway:0.1.0` held when this packet was written, read
  # from the registry with `docker buildx imagetools inspect` and quoted in
  # the brief. The value committed by the previous packet
  # (`roll-c5-image-digest`) was `sha256:9edaa9ce…` (master `f8a5caa`) — so
  # BETWEEN THE TWO PACKETS THE TAG MOVED AGAIN, and no one but a manual
  # re-resolve noticed: that is the defect this field exists to close,
  # restated by its own staleness. The staleness is expected rather than
  # fixed by hand: the publish run overwrites this line with the digest it
  # just built, so the OCI chart always names the bytes beside it, and this
  # committed value is the floor a `push: false` run and a fresh clone render.
  #
  # The chart VERSION does not move (Chart.yaml's `version` is the OCI tag
  # and the substrate's Application targetRevision), so the chart's content
  # changes under a fixed tag and the diff fires on refresh.
  digest: "sha256:e498ceb688c25776ccdf1c6c3c00691702cc703bbc2cefb1502e6afb011158d6"
  # A value, never `latest`: a floating tag is a deploy that changes when
  # somebody else pushes. Kept, and kept EQUAL to Chart.yaml's appVersion —
  # kit's publish seam asserts the pair — because the tag is the
  # human-readable half of the name an operator reads in
  # `kubectl get deploy -o jsonpath`, and the digest above is the half that
  # cannot move. The publish path still pushes this tag; the Deployment just
  # no longer pulls by it. Until a release exists, `docker-compose.yml`'s
  # `anywaye/gateway:dev` is the LOCAL image, built by `docker compose build`
  # and never pulled.
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# One replica is the honest default. More than one is safe HERE in a way it is
# not in most services, because `REDIS_URL` below is a required secret
# reference: the counters are shared and survive a restart, so N replicas is
# one limit and not N×. A chart that made Redis optional would have to default
# this to 1 with a warning; this one does not.
replicaCount: 1

service:
  type: ClusterIP
  # Must agree with `env.PORT` below — the container listens on PORT and the
  # Service forwards to the same number. Both are values so a generator emits
  # them; the agreement is the operator's, and the comment is where it lives.
  port: 8080

ingress:
  enabled: true
  # Traefik is k3s's default ingress controller (DEPLOYMENT.md), so the
  # Ingress is a plain `networking.k8s.io/v1` resource with this class.
  className: traefik
  # The platform's front-door name: `api.anywaye.com`, the plan's public door
  # (PLAN-names-urls-rollout.md §1). Per-tenant deployments override it.
  host: api.anywaye.com
  # The cert-manager ClusterIssuer that fills `ingress.tls.secretName`:
  # `letsencrypt-prod`, the issuer the substrate's install creates
  # (DEPLOYMENT.md, "The ACME solver"). The chart NAMES the issuer and never
  # creates it — the same discipline as the Redis secret below. Rendered as
  # the `cert-manager.io/cluster-issuer` annotation, and ONLY when
  # non-empty: empty means no cert-manager, and a secret nothing writes (the
  # generator's own rule, `caf gen chart`). This is launch item B7 — without
  # the annotation, TLS fails on the box and the browser surface cannot work
  # at all, because the session cookie is `Secure`.
  clusterIssuer: letsencrypt-prod
  annotations: {}
  tls:
    # The browser surface's cookie is `Secure` (DEPLOYMENT.md, launch item B7:
    # no TLS anywhere in the stack is a launch blocker), so TLS is not
    # optional for the front door. The secret is filled by cert-manager from a
    # ClusterIssuer the substrate provides; the chart names it and does not
    # create it, the same way it names the Redis secret and does not create it.
    enabled: true
    secretName: gateway-tls

# The clear environment, rendered into a ConfigMap the Deployment reads with
# `envFrom`. Every key is one the shipped binary reads — each is in
# `internal/httpapi/runtime.go`'s list of fifteen. The chart carries the eleven
# a launch deployment sets; `IDENTITY_JWKS_URL` is left at its default, the same
# way `docker-compose.yml` leaves it.
# `GATEWAY_OTEL_ENDPOINT` is read by `internal/telemetry`, not the runtime
# reader, and is deliberately unset: the in-cluster collector address belongs
# to the observability stack (L12), and a guessed default is worse than the
# documented fallback.
env:
  PORT: "8080"
  # Where tokens are VERIFIED: the issuer-only base URL; gateway appends
  # `/.well-known/jwks.json` itself. Must match the `iss` identity mints and be
  # fetchable by this pod for the key set: the plan's OIDC issuer,
  # `auth.anywaye.com` (PLAN-names-urls-rollout.md §1). An https origin in every
  # environment, including this one.
  IDENTITY_ISSUER: "https://auth.anywaye.com"
  # Where a session is REQUESTED: identity's in-cluster Service. The two
  # variables for one service on purpose — the issuer is an https origin, the
  # address this dials is a service name, and inside a cluster `localhost` is
  # gateway itself. Must match identity's own chart (release `identity` in
  # this namespace).
  IDENTITY_URL: "http://identity:8080"
  # The `aud` every token must be addressed to — gateway's own client id.
  GATEWAY_CLIENT_ID: "gateway"
  # How long a fetched key set is reused, in milliseconds. Also the
  # revocation window: a key identity withdraws keeps verifying until this
  # expires.
  IDENTITY_JWKS_TTL_MS: "300000"
  # The general allowance: requests per window on `/v1/*` and anything
  # unclaimed. The per-route table (login 10/min, register 5/min, …) is code,
  # not configuration — see README, "Per-route allowances".
  RATE_LIMIT_REQUESTS: "600"
  RATE_LIMIT_WINDOW_MS: "60000"
  # How many proxies append to X-Forwarded-For, and therefore how much of it
  # the rate limiter believes. Behind Traefik that is one hop, so this is 1.
  #
  # WHAT A WRONG ONE COSTS, stated at the line because it is not a crash: at
  # 0 the limiter believes none of the header and keys every caller on the
  # ingress's peer address, so the launch rate-limits all users as one — one
  # attacker's burst spends everybody's allowance. Too high is the same defect
  # pointing the other way: a caller who can write the trusted hop mints a
  # bucket per request. Neither fails loudly; the limiter just quietly merges
  # or splits buckets, which is why the number is a value with its reason and
  # not a default somebody never looks at.
  TRUSTED_PROXIES: "1"
  # Where each configured prefix goes, as one JSON object of prefix →
  # {baseUrl, token?, public?, principal?}. Every prefix must be under
  # `/v1/`, and every value is validated at startup — a malformed table is a
  # refusal to boot, not a degraded mode.
  #
  # Pantry is split in two on purpose, because the table matches on path
  # prefixes and pantry's reads and writes share paths: `GET /v1/projects`
  # (list) and `POST /v1/projects` (register) differ by method, which no
  # prefix can see. So the gateway paths differ instead:
  #
  #   * `/v1/pantry` stays public: anonymous catalog reads, no assertion.
  #   * `/v1/pantry-writes` is the write surface: authenticated, declaring
  #     `principal: ["sub"]` — sub only — so gateway mints its short-lived
  #     RS256 assertion (`aud` = pantry's origin) on every proxied write.
  #     `POST /v1/pantry-writes/projects` reaches pantry as `POST /projects`
  #     with `x-anywaye-principal` attached. `github_id` stays out: pantry
  #     treats it as optional metadata, and a second claim is a second
  #     credential surface nobody asked for.
  #
  # A public entry may never declare `principal` (refusal to boot, and refused
  # again at the send site), so the read prefix carries none.
  #
  # It carries upstream `token`s, so it is configuration with credentials in
  # it — the same shape `docker-compose.yml` has always carried it. Moving it
  # to the secret below is a one-line change when a packet wants it.
  # THE ORIGIN IS THE OPERATED REGISTRY, AND IT IS NOT IN THIS CLUSTER.
  # `http://pantry:8080` was an in-cluster name for a service a customer's box
  # must never run: pantry is Anywaye-proprietary and its licence says it "runs on
  # Anywaye infrastructure … the box pattern applies: closed code, public HTTPS
  # endpoint". The live consequence was a public 503 —
  #
  #   GET https://api.anywaye.com/v1/pantry = 503 "the service this request needs
  #   could not be reached"
  #
  # — because gateway published two routes to a service the substrate does not
  # (and must not) deploy. `anywaye/cafe` already names the right origin:
  # `internal/resolve/pantry.go:94` and `internal/publish/publish.go:461` both
  # read "BaseURL is pantry's origin, e.g. https://pantry.anywaye.com", and
  # `CAF_PANTRY_URL` is the environment variable a `caf` caller sets. This value
  # is that same origin, in the one place gateway reads it.
  #
  # It is also the `aud` the assertion is minted with, so pantry's own
  # `PANTRY_AUDIENCE` must equal it — the pairing the note further down states.
  ROUTE_TABLE: '{"/v1/pantry":{"baseUrl":"https://pantry.anywaye.com","public":true},"/v1/pantry-writes":{"baseUrl":"https://pantry.anywaye.com","principal":["sub"]}}'
  # How long a minted principal assertion is good for, in milliseconds.
  # 120000 is the mechanism's default, restated here so the launch value sits
  # next to the table that requires it. Refused above 600000 — pantry's own
  # ten-minute ceiling — so this number cannot drift into a lifetime pantry
  # would refuse.
  ASSERTION_TTL_MS: "120000"
  # The key the assertion is signed with, as a FILE PATH inside the container
  # (a path, never the PEM itself: a private key in an environment value turns
  # up in `docker inspect` and `/proc/<pid>/environ`). The file arrives on the
  # `assertion-key` volume in the Deployment, mounted from the secret
  # `secrets` names below — created out of band, never by this chart, the same
  # discipline as REDIS_URL. No secret, no pod: a principal entry with no key
  # mints nothing, which would reopen the seam this table closes as a silent
  # 401 at pantry's second hop.
  ASSERTION_SIGNING_KEY_FILE: "/etc/gateway/assertion/signing.pem"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy.observability:4318"
  OTEL_SERVICE_NAME: "gateway"

# The secret environment. `REDIS_URL` is a REFERENCE, never a value here: the
# secret lives on the box and the chart names it, because DEPLOYMENT.md and the
# fleet's rule agree that closed-source charts and their secrets ride a
# pull-based system — the chart is pulled, the value is not.
#
# WHAT MISSING IT COSTS, both halves, because a deployment that forgets Redis
# must not be able to boot:
#
#   * no browser surface — the four `/auth/*` routes decline, so there is no
#     sign-in. A per-process session store is the shape that would sign a
#     browser out on the next restart and on whichever replica it did not
#     sign in to, so the Go runtime refuses to build the surface without a
#     shared store;
#   * an N× rate limit — counters are per process, so N replicas is N times the
#     allowance, every bucket is lost on restart, and nothing in the platform
#     would notice.
#
# The reference is a REQUIRED `secretKeyRef`: no secret, no pod. That is the
# property this packet exists to create — a deployment cannot forget Redis.
secrets:
  # The secret's name on the box. Created out of band (the substrate's secret
  # management), never by this chart: a chart that rendered the value would be
  # a literal in Git, which is the one thing DEPLOYMENT.md forbids.
  # Deliberately NOT `gateway-env`, which is the ConfigMap's name: two
  # resources of different kinds sharing a name is legal in Kubernetes and
  # confusing in every `kubectl get` that shows both.
  redisUrlSecretName: gateway-secrets
  # The key inside it. `REDIS_URL` is `redis://` or `rediss://`, host and port,
  # no path; a malformed URL is a refusal to boot, and a Redis that is DOWN is
  # a `/readyz` answer, not a refusal to start.
  redisUrlSecretKey: REDIS_URL
  # The secret holding the assertion signing key. Same discipline as Redis:
  # created out of band, never rendered by this chart; referenced here and
  # mounted as a file by the Deployment, because ASSERTION_SIGNING_KEY_FILE
  # is a path and a path has to resolve to bytes.
  assertionKeySecretName: gateway-secrets
  # The key inside it holding the PKCS#8 PEM. `openssl genpkey -algorithm RSA
  # -pkeyopt rsa_keygen_bits:2048` writes one; the public half goes to pantry
  # out of band as its verifier key, and PANTRY_AUDIENCE there must equal the
  # origin ROUTE_TABLE above names (`https://pantry.anywaye.com`) — pantry
  # refuses any other `aud`.
  assertionKeySecretKey: ASSERTION_SIGNING_KEY

resources:
  # Set, because a chart with no limits is a chart that lets one service take
  # the box — and DEPLOYMENT.md sizes the box at 8GB comfortable, 4GB no longer
  # qualifying. gateway is a small Go process: it holds a JWKS cache, a
  # per-bucket counter set and one connection pool, and nothing that grows
  # with traffic.
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  # Liveness is `/healthz`: unconditional, touches nothing, the one question a
  # restart can usefully act on. A dependency outage must NOT restart the
  # gateway — that is `/readyz`'s to report.
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 15
  # Readiness is `/readyz`: gateway's real, dependency-aware probe — it names
  # each registered dependency (identity always, redis when `REDIS_URL` is
  # set) and answers 503 when one is down. An Argo or rollout gate that reads
  # `/healthz` accepts a container that cannot reach identity, which is the
  # whole reason `/readyz` exists.
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
