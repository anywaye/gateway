# The pull-only loop, complete: a commit changes the chart, Argo makes the box
# agree. DEPLOYMENT.md — ArgoCD core, no Dex, no SSO, no Redis HA; the only
# thing that can change the cluster is a commit, hand edits self-heal, and
# rollback is `git revert`.
#
# This manifest is NOT part of the chart and is NOT a Helm template: Argo
# reads it directly, and `helm template` never sees it. It lives beside the
# chart it deploys because the two are one fact — the chart is what runs, this
# is what makes it run.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
  # Without the finalizer, `prune: true` leaves orphaned resources behind
  # when the Application is deleted. The finalizer is what makes deletion mean
  # "remove what was deployed", not "stop managing it".
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # This repository, over https, because it is public (cafaye.yml:
    # `visibility: public`) and the cluster holds no credentials for it —
    # pull-only means CI never holds cluster credentials, and a public repo
    # needs none. When charts ship from GHCR (DEPLOYMENT.md: closed-source
    # charts ride a pull-based system with a read-only pull secret), this
    # becomes a chart repository URL and the pull secret joins it; nothing
    # else in this file moves.
    repoURL: https://github.com/cafaye/gateway.git
    # The branch, not a tag: the fleet ships commits, not releases, and
    # nothing is tagged yet. Pinning a tag is the first thing a real release
    # does.
    targetRevision: master
    path: charts/gateway
    helm:
      valueFiles:
        # The chart's own defaults ARE the launch values — one file, one
        # source of truth. A deployment that needs to override (a per-tenant
        # host, a route table) adds a file here rather than editing the
        # chart's defaults, so the chart stays the reference implementation
        # and the override stays reviewable.
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    # The launch stack's namespace — the same name the compose project uses
    # (`cafaye`), so the fleet's one stack has one name in both substrates.
    namespace: cafaye
  syncPolicy:
    automated:
      # Hand edits self-heal: an agent that "fixes" production by
      # kubectl-editing is reverted in minutes, and the only write path is a
      # commit. That is what makes delegating operations to agents safe
      # rather than brave (DEPLOYMENT.md, "Agents get super powers").
      prune: true
      selfHeal: true
