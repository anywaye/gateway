apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/anywaye/gateway.git
    path: deploy
    targetRevision: master
    plugin: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
