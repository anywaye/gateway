
services:
  gateway:
    build:
      context: .
      args:
        GO_VERSION: "1.26"
    image: anywaye/gateway:dev

    networks:
      - platform

    ports:
      - "8080:8080"

    environment:
      PORT: "8080"
      GATEWAY_OTEL_ENDPOINT: "http://otel-collector:4317"
      IDENTITY_ISSUER: "https://identity.localhost"
      IDENTITY_URL: "http://identity:8080"
      TRUSTED_PROXIES: "0"
      REDIS_URL: "redis://redis:6379"



    healthcheck:
      test: ["CMD", "/app/service", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

networks:
  platform: