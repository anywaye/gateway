---
name: gateway
description: The anywaye public gateway — the only door in, terminating auth and rate limits in front of every service.
language: go
core: ^0.2.0

exposes:
  api: openapi/v1.yaml

consumes: []

dependencies:
  - name: identity
    version: ^0.1.0
    required: true

env:
  - name: PORT
    required: false
    default: "8080"
    secret: false
    description: "Listen port."
  - name: IDENTITY_URL
    required: false
    default: "http://localhost:8080"
    secret: false
    description: "Identity base URL."
  - name: REDIS_URL
    required: false
    secret: true
    description: "Redis for counters/sessions."

repository:
  url: git@github.com:anywaye/gateway.git
  defaultBranch: master
  visibility: private

owner:
  team: gateway
  contact: gateway@anywaye.com
