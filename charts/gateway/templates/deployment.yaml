apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gateway.fullname" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gateway.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "gateway.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    spec:
      containers:
        - name: gateway
          # THE IMAGE IS NAMED BY DIGEST WHEN THERE IS ONE, AND BY TAG WHEN
          # THERE IS NOT — a two-render conditional, and each arm is a
          # measured failure avoided.
          #
          # `repository@digest` is the arm a PUBLISHED chart takes, and the
          # defect it closes was measured on the live box: the registry's
          # `ghcr.io/cafaye/gateway:0.1.0` held sha256:c264…37165 (the Redis
          # AUTH fix) while the node ran sha256:8e60…e79b, six hours older.
          # `repository:tag` renders a string IDENTICAL before and after a new
          # build — the tag is overwritten on every master push — so Argo's
          # diff reported `Synced`, rolled nothing, and `IfNotPresent`
          # re-served the node's stale copy on every restart. A digest cannot
          # move, so the rendered text changes when the image changes and Argo
          # rolls the Deployment. `chart.reusable.yml` writes this value on
          # every publish, and the committed digest in values.yaml is what a
          # fresh clone renders.
          #
          # `repository:tag` is the arm an UNPUBLISHED chart takes. An empty
          # digest interpolated unconditionally would render `repository@` —
          # a reference no registry answers and a pod stuck in image-pull —
          # so absence falls back to the tag rather than stamp a broken name.
          # Kit's `pin the image by digest` INSERTS the field on a chart that
          # has not adopted it yet, so this arm is also what the first publish
          # renders before there is a digest to write.
          #
          # A MALFORMED DIGEST IS REFUSED, NOT RENDERED. The kit step refuses
          # anything that is not `sha256:<64 lowercase hex>` before it writes
          # the field, and `bin/prime-go` refuses it statically at the gate;
          # the template mirrors both rather than render `repository@nonsense`,
          # which LOOKS like a pin and fails at image-pull with nothing naming
          # the field. Absent is legitimate — it falls back to the tag;
          # malformed never is.
          {{- $digest := .Values.image.digest | default "" }}
          {{- if $digest }}
          {{- if not (regexMatch "^sha256:[0-9a-f]{64}$" $digest) }}
          {{- fail (printf "image.digest is %q, which is not sha256:<64 lowercase hex>. A malformed digest renders a reference no registry answers, so the chart refuses it the way the publish step does. Drop the key to render the committed tag, or set a real sha256 digest." $digest) }}
          {{- end }}
          image: "{{ .Values.image.repository }}@{{ $digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "gateway.fullname" . }}-env
          env:
            # REDIS_URL, and the only secret this chart references. A
            # required secretKeyRef: the pod does not start without the
            # secret, which is the property — a deployment cannot forget
            # Redis. See values.yaml at `secrets` for both consequences.
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.redisUrlSecretName }}
                  key: {{ .Values.secrets.redisUrlSecretKey }}
          # The assertion signing key, mounted as a file because
          # ASSERTION_SIGNING_KEY_FILE is a path. readOnly: a gateway that
          # could rewrite its own signing key is a gateway that could lose it.
          volumeMounts:
            - name: assertion-key
              mountPath: /etc/gateway/assertion
              readOnly: true
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      # One volume, and it holds the one file the ConfigMap cannot: the
      # private key ASSERTION_SIGNING_KEY_FILE names. Mounted from the secret
      # `values.secrets` names (created out of band, like the Redis secret),
      # with `items` pinning the file name the env var points at — a secret
      # that renamed its key would otherwise move the file out from under it.
      volumes:
        - name: assertion-key
          secret:
            secretName: {{ .Values.secrets.assertionKeySecretName }}
            items:
              - key: {{ .Values.secrets.assertionKeySecretKey }}
                path: signing.pem
