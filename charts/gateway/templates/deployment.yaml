apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gateway.fullname" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gateway.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "gateway.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    spec:
      containers:
        - name: gateway
          # THE IMAGE IS NAMED BY DIGEST, NOT BY TAG — the measured defect,
          # on the live box: the registry's `ghcr.io/cafaye/gateway:0.1.0`
          # held sha256:c264…37165 (the Redis AUTH fix) while the node ran
          # sha256:8e60…e79b, six hours older. `repository:tag` renders a
          # string that is IDENTICAL before and after a new build — the tag
          # is overwritten on every master push — so Argo's diff reported
          # `Synced`, rolled nothing, and `IfNotPresent` re-served the node's
          # stale copy on every restart. A digest cannot move, so the
          # rendered text changes when the image changes and Argo rolls the
          # Deployment. `pullPolicy` stays `IfNotPresent`: the digest already
          # guarantees the content, and the operator-readable tag stays in
          # values.yaml beside this reference (values.yaml's `image` block
          # carries the measured evidence).
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "gateway.fullname" . }}-env
          env:
            # REDIS_URL, and the only secret this chart references. A
            # required secretKeyRef: the pod does not start without the
            # secret, which is the property — a deployment cannot forget
            # Redis. See values.yaml at `secrets` for both consequences.
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.redisUrlSecretName }}
                  key: {{ .Values.secrets.redisUrlSecretKey }}
          # The assertion signing key, mounted as a file because
          # ASSERTION_SIGNING_KEY_FILE is a path. readOnly: a gateway that
          # could rewrite its own signing key is a gateway that could lose it.
          volumeMounts:
            - name: assertion-key
              mountPath: /etc/gateway/assertion
              readOnly: true
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      # One volume, and it holds the one file the ConfigMap cannot: the
      # private key ASSERTION_SIGNING_KEY_FILE names. Mounted from the secret
      # `values.secrets` names (created out of band, like the Redis secret),
      # with `items` pinning the file name the env var points at — a secret
      # that renamed its key would otherwise move the file out from under it.
      volumes:
        - name: assertion-key
          secret:
            secretName: {{ .Values.secrets.assertionKeySecretName }}
            items:
              - key: {{ .Values.secrets.assertionKeySecretKey }}
                path: signing.pem
