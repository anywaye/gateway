# Toolchain pins for gateway. The worktree and CI must agree, so the versions
# live here rather than in whatever the machine happens to have installed.
#
# ONE LANGUAGE, AND THAT IS THE DESIGN. This file used to pin `bun` and `node`
# beside `go`, with a comment saying the TypeScript pins go away when `src/` does
# and that the two-pin state was temporary. `src/` is gone — deleted at cutover
# (f87c891), after the equivalence harness measured 51 cases / 13 scenarios /
# 914 comparisons / 0 differences — and these pins are the promise being kept.
# package.json, bun.lock and tsconfig.json went in the same commit.
#
# `bin/prime-go` asserts the Go pin against `go.mod`'s own `go` directive before
# it runs anything, because nothing else makes the go command enforce either
# file. The pattern came from a Rust gate that had the same hole: three files
# naming a toolchain and a gate that checked none of them, so a developer on a
# newer compiler read the difference as a defect in the code under test (the
# cafaye-rb lesson, and it cost a debugging session).
#
# The Go pin is TWO files and the gate checks both. 1.26.1 is the toolchain the
# build and the tests run on, and it is the SAME number `pantry/go.mod` and
# `identity/go.mod` state — a fleet that pins three copies of a toolchain needs
# them to agree, and this gate is what makes them. `Dockerfile`'s
# ARG GO_VERSION is 1.26, the tag the image builds with, the same way
# RUST_VERSION used to name an image rather than a patch. go.mod's `go` directive
# is the third copy and is the one the compiler enforces.
#
# WHAT IS NOT HERE, and the omission is the point rather than an oversight:
# `bun` and `node`. Nothing in this repository runs them any more. There is no
# TypeScript source to run, no manifest, no lockfile, and no test runner that
# finds a test; a pin for a runtime the gate never invokes is a second number
# for a reader to wonder whether somebody forgot to remove the first one.
# golangci-lint is the fleet's Go linter. Pinned here so `bin/prime-go` and CI
# agree on the version that decides whether the tree is lint-clean. The pin
# lives in one more place: `cafaye/kit/ci/ci.reusable.yml`'s
# `golangci/golangci-lint-action` step, which pins the same version via its
# `version:` input. A bump touches both, in the same commit — otherwise local
# and CI disagree, which is the defect this packet exists to close.
[tools]
go = "1.26.1"
"golangci-lint" = "2.14.0"

[tasks.prime]
description = "The gate: the Go tier, gofmt/build/vet/test plus generated-code currency"
run = "./bin/prime"

[tasks.prime-go]
description = "The Go tier of the gate: gofmt, build, vet, test, generated-code currency"
run = "./bin/prime-go"

[tasks.build-go]
description = "Build the Go binary into ./build"
run = "mkdir -p build && go build -trimpath -o build/gateway ./cmd/gateway"

[tasks.run-go]
description = "Serve the Go gateway on PORT (default 8080)"
run = "go run ./cmd/gateway"

[tasks.generate-go]
description = "Regenerate internal/api from openapi/v1.yaml. Run in the SAME commit as the document change."
run = "go generate ./internal/api/"

[tasks.fmt-go]
description = "Fail if anything under ./cmd or ./internal needs gofmt"
run = "gofmt -l ./cmd ./internal"

[tasks.lint-go]
description = "go vet, which is what this tier treats as the linter"
run = "go vet ./..."