---
# The CI path for gateway.
#
# The shared half is kit's reusable workflow: one `uses:` line, and a fix to the
# toolchain or the linter reaches this repository on its next run without a PR
# here. The `.github/workflows/` in that path is not decoration — GitHub resolves
# a reusable workflow at `{owner}/{repo}/.github/workflows/{file}@{ref}` and
# documents that subdirectories of the workflows directory are not supported, so
# `cafaye/kit/workflows/ci.reusable.yml@master` resolves to nothing. kit-04 is
# landing that move in parallel with this packet; until it merges, this file
# points at a path that does not exist yet on `master` and the `ci` job is
# red. That is stated rather than worked around: a workflow quietly rewritten to
# a path that resolves is a workflow nobody reviewed.
#
# The jobs below it are gateway's, and each one is here because kit cannot own it.
# kit holds conventions; these reach into this repository's own shape.
#
# No secrets, no cafaye service is contacted, nothing is published. Release work
# is a separate workflow so a red test can never publish.
name: ci

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# THERE IS NO WORKFLOW-LEVEL ENV ANY MORE, and the absence is the finding.
#
# This file used to set `GATEWAY_EQUIVALENCE_REQUIRED: "1"` job-wide, on the
# reasoning that a skip nobody can see is a green run that verified nothing. The
# reasoning was sound and the flag had a reader: `bin/prime-go`, inside the
# branch that fired when the equivalence tier printed its counted skip.
#
# Then two commits in the same merge removed the reader, from opposite ends:
#
#   f87c891  deleted the harness that printed the summary line the flag guarded
#   3e9f856  (this file's sibling packet) deleted the whole equivalence block
#            from `bin/prime-go` -- which was already dead, since it exits 1 at
#            an EARLIER check, before the flag is ever read
#
# The variable was kept across that merge on a measurement that was correct when
# it was taken and wrong by the time the two packets landed: it grepped
# `bin/prime-go:172` and found the reader. In the merged tree there is none:
#
#   $ grep -rn GATEWAY_EQUIVALENCE_REQUIRED --exclude-dir=.git --exclude-dir=node_modules .
#   Dockerfile:83, README.md:947, CHANGELOG.md:639, AGENTS.md:408, gate.yml:347,
#   REPORT-*.md, HANDOFF-*.md   -- prose describing a tier that no longer exists
#   .github/workflows/ci.yml     -- the comment above
#   (no reader; rc=1)
#
# A variable that is set in CI and read by nothing is worse than a missing one.
# It costs a reader's time, it implies a gate that does not exist, and it is the
# shape of the exact bug the CI work in this repository keeps finding: a claim
# wired to nothing, reading as a check because it is spelled like one.
#
# The prose hits are NOT fixed here. `Dockerfile:83`, `README.md:947`,
# `AGENTS.md:408`, `CHANGELOG.md:639` and `gate.yml:347` all describe the
# equivalence tier as something CI sets, and every one of them is now false.
# They are documentation, they do not affect any run, and they are a separate
# packet from this one. They are named here so the next person does not have to
# rediscover that the variable and the prose went out of date together.
env: {}

jobs:
  # -------------------------------------------------------------- shared half
  # `language: go` runs download, build, golangci-lint against kit's config,
  # `go test -race -count=1 ./...` and a coverage floor. It is the same work
  # `bin/prime-go` does, from kit's copy of the conventions, which is the point
  # of calling it rather than maintaining a second version here.
  #
  # WAS `language: bun`, AND THAT WAS A FALSE CLAIM. This line said the
  # repository's service manifest was a package.json. It stopped being one at
  # f87c891: 76 files of TypeScript deleted, `-15961 lines`, `src/` and
  # `test/equivalence/reference.ts` with it. kit's `bun` job opens with
  # `bun install --frozen-lockfile`, then typecheck, then `bun test` — against a
  # repository with no dependency graph and no TS suite. That job either fails on
  # the install or, worse, is green while typechecking nothing. A CI file that
  # names a toolchain this repository does not have is not documentation, it is a
  # check on a lie.
  ci:
    name: ci (kit)
    uses: cafaye/kit/.github/workflows/ci.reusable.yml@master
    with:
      language: go
      working-dir: .
      # The pin, passed rather than defaulted. kit reads
      # `fromJSON(inputs.versions).go || 'stable'` — so an absent key here is not
      # "use our pin", it is "install whatever Go the runner ships this week".
      # A default that happens to match is a default nobody is checking, and this
      # one would keep matching right up to the day it did not.
      #
      # 1.26.1, READ NOT ASSUMED. `mise.toml` says `go = "1.26.1"` and `go.mod`
      # says `go 1.26.1`, and the two were confirmed to agree independently
      # before this line was written — `go.mod` is the copy the compiler
      # enforces, so it is the one that gets to decide, and mise.toml is the copy
      # the worktree uses. `bin/prime-go` asserts the two against each other at
      # startup, which is what keeps a bump in either one a red build rather than
      # a compile error nobody expected.
      #
      # The three copies of the Go pin: this line, `go.mod`, `mise.toml`. And
      # `Dockerfile`'s `ARG GO_VERSION is 1.26`, which names an image tag rather
      # than a patch, the way `RUST_VERSION` used to. `versions` is the ONLY copy
      # here that nothing checks, because kit's own gate cannot see it — the
      # value arrives from this caller and is not in any tree. That is why it is
      # written out in full rather than inherited from a default.
      versions: '{"go":"1.26.1"}'
      # The binaries the Go tests EXEC, handed to kit so its shared `go` job
      # installs them before `go test ./...`.
      #
      # `internal/httpapi`'s runtime session tests start a real `redis-server` by
      # executing the binary rather than dialing a URL, and they FAIL rather than
      # skip when it is absent — so kit's `go` job, which ran `go test ./...` and
      # installed nothing, was red on a missing apt package rather than on a
      # defect. This is the general seam kit grew for exactly that: a caller names
      # the binary its suite needs, and the shared job provides it. The same tool
      # is installed directly in the `prime` job below, because `bin/prime` runs
      # its own `go test` and never passes through kit.
      #
      # `bin/prime-go` asserts this line exists — the tool is derived from the
      # tests' `exec.LookPath` calls, not from a list somebody maintains — so a
      # test that starts execing a NEW binary reds the local gate until a value
      # here and a matching `test-packages` in kit provide it.
      test-packages: redis-server

  # ------------------------------------------------- the gate a developer runs
  # Done means `bin/prime` is the gate and it is the same command locally and in
  # CI. kit's `go` job is the same *steps*, but not the same command: a gate
  # nobody runs is a gate nobody maintains, and this job is what keeps that true.
  # It also carries the manifest guard, which has to run *after* the gate and so
  # cannot live inside kit's job.
  prime:
    name: bin/prime
    runs-on: ubuntu-latest
    # 15, and not GitHub's 360-minute default: a hung job burns billing hours.
    # bin/prime with no database is minutes of Go build and test, so 15 is a
    # ceiling a healthy run never reaches.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: read kit.ref
        # GitHub Actions cannot read a file's contents into an expression, so
        # the pin goes through $GITHUB_ENV once and the checkout below reads it
        # from the environment. `grep -v` on the comment marker rather than
        # `sed -n 2p`, because a file whose comment block grows must not silently
        # hand the checkout the wrong line.
        run: |
          ref="$(grep -v '^\s*#' kit.ref | grep -v '^\s*$' | head -1)"
          if [ -z "$ref" ]; then
            echo "::error::kit.ref holds no ref (only comments/blanks) — the gate cannot find kit's lint config" >&2
            exit 1
          fi
          echo "KIT_REF=$ref" >> "$GITHUB_ENV"
      # `go-version-file: go.mod` rather than a literal version, and that is the
      # point: the pin now lives in `go.mod` (which the compiler enforces) and in
      # `mise.toml` (which `bin/prime-go`'s first step checks against it), and a
      # literal here would be a FOURTH copy for CI to disagree with. Two copies,
      # one of them checked by the gate at startup — the arrangement
      # `pantry/.github/workflows/ci.yml:35` states the same way.
      #
      # The step order matters and it is not alphabetical: `setup-go` must come
      # before `bin/prime`, because `bin/prime` ends in `./bin/prime-go` and that
      # script exits 127 on a machine with no Go toolchain rather than skipping.
      #
      # WHAT WAS HERE: `oven-sh/setup-bun@v2` with `bun-version: "1.3.12"`,
      # removed. Not because installing a toolchain is expensive -- it is cheap
      # and it worked -- but because it was the only thing standing between this
      # job and a claim it could not keep. With no `src/` there is no TypeScript
      # for Bun to run; the step existed to make `bun install --frozen-lockfile`
      # possible inside `bin/prime`, and a runner that cannot install a
      # dependency graph that is no longer in the repository fails at the `require
      # bun` on line 136 of that script rather than at the thing it was
      # preparing for.
      #
      # `bin/prime` and `bin/prime-go` are still Bun-flavoured scripts TODAY and
      # this job is still red because of it -- see the note at the end of this
      # commit. Dropping the setup step here does not make that job green; it
      # removes a step whose only remaining purpose was to serve a deleted
      # `src/`, and leaves the real failure to be fixed in the script that owns
      # it. That script belongs to another worker and was not edited here.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: kit (lint config)
        # kit's `lint/golangci.yml`, sparse-checked out beside the repository so
        # `bin/prime-go` finds it at `.kit/lint/golangci.yml`. The config is NOT
        # copied into this repo — kit's own header says why ("Not copied into a
        # service repo") and a copy is a second policy to drift. Without this
        # step the gate runs the linter with no config at all and, per golangci
        # v2's measured behaviour, exits 0 on a file this config rejects.
        #
        # The same seam kit's own `go` job carries (`ci.reusable.yml`,
        # `KIT_LINT_DIR`) — one shape in two places, because the shared job and
        # this service's gate both need it and neither can read the other's.
        #
        # The ref is `kit.ref`, the pin this repository runs, read out of the
        # file because a branch would move and a lint policy that moves under a
        # repo is the drift the file's own header forbids. The file's first line
        # is a comment, so the read skips comments and blanks rather than
        # assuming line 2.
        uses: actions/checkout@v7
        with:
          repository: cafaye/kit
          ref: ${{ env.KIT_REF }}
          path: .kit
          sparse-checkout: lint
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: the oapi-codegen tool the gate runs, in the module cache
        # `bin/prime-go` regenerates `internal/api/api.gen.go` by running
        # `go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0`
        # (`internal/api/generate.go`'s first `//go:generate` line). A `go run
        # pkg@version` fetches that version's MODULE on demand, and a fresh
        # runner has no cache entry for it — so the gate failed on a runner that
        # had never seen the generator:
        #
        #     go: github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0:
        #     github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0:
        #     reading file:///home/runner/go/pkg/mod/cache/download/...
        #     internal/api/generate.go:35: running "go": exit status 1
        #
        # The failure is a gate that cannot run rather than a gate that failed,
        # which is the class `roll-c5-ci-tool-parity` opened. One `go mod
        # download` of the module makes the cache entry and every later `go run`
        # in this job is offline.
        #
        # THE VERSION IS READ, NOT WRITTEN. A literal here would be a third copy
        # beside `generate.go`'s pin, and a drift between them is a gate that
        # runs a different generator than the tree declares. The tree has
        # exactly one source for it: `generate.go`.
        run: |
          version="$(grep -oE 'oapi-codegen/v2/cmd/oapi-codegen@[^ ]+' internal/api/generate.go | head -1 | sed 's/.*@//')"
          if [ -z "$version" ]; then
            echo "::error::generate.go names no oapi-codegen version to pre-seed" >&2
            exit 1
          fi
          echo "pre-seeding oapi-codegen $version"
          go mod download "github.com/oapi-codegen/oapi-codegen/v2@${version}"
      - name: redis-server, which the runtime session tests exec
        # `internal/httpapi`'s runtime session tests start a real `redis-server`
        # by EXECUTING THE BINARY rather than dialing a URL, on purpose: the tier
        # "cannot lie about having run", and a URL an operator set could be
        # unreachable while the run stayed green. So a runner with no Redis binary
        # fails three tests loudly, and this job was doing exactly that:
        #
        #   runtime_session_test.go:52: this test needs a real `redis-server` on
        #   PATH and there is none ... exec: "redis-server": executable file not
        #   found in $PATH
        #
        # The `bin/prime` job has no way to start a Redis service, so the binary is
        # installed here. It is NOT the `redis (live tier)` job's service: that job
        # runs a different, URL-gated tier against a container.
        run: sudo apt-get update -qq && sudo apt-get install -y redis-server
      - name: golangci-lint, the version mise.toml pins
        # THE TOOL `bin/prime` NOW REFUSES WITHOUT, INSTALLED AT THE PIN.
        #
        # `roll-c5-lint-parity` added `golangci-lint run` to `bin/prime-go`, which
        # exits 127 when the binary is not on PATH — the refusal working, not a
        # defect. This job installed Go and redis-server and ran `bin/prime`, but
        # it never ran mise, so the binary the local gate gets for free was absent
        # and the step exited 127. The gate was right; the job had not been taught
        # to provide what the gate now requires.
        #
        # The VERSION IS READ FROM `mise.toml`, not typed here, and that is the
        # point rather than a flourish: a literal here would be a THIRD copy of
        # the number beside mise.toml's pin and kit's `golangci-lint-action`
        # `version:`, and `bin/prime-go` already compares the running binary
        # against mise.toml — so a literal that drifted would red every run with a
        # version message whose fix is in a file that is not wrong. One pin, read
        # where it lives.
        #
        # The RELEASE ARCHIVE is pinned by version, never the installer script at
        # a moving ref: the linter version is what decides whether the tree is
        # lint-clean, and an installer fetched from HEAD is that number with a
        # fourth home. `bin/prime-go`'s version assertion is what proves this step
        # installed the pin rather than something adjacent.
        run: |
          set -euo pipefail
          version="$(sed -n 's/^"golangci-lint" *= *"\(.*\)"/\1/p' mise.toml)"
          if [ -z "$version" ]; then
            echo "::error::mise.toml pins no golangci-lint, and bin/prime-go refuses"
            echo "::error::to run without the binary. Restore the pin rather than"
            echo "::error::installing whatever GitHub calls current."
            exit 1
          fi
          arch="$(uname -m)"
          case "$arch" in
            x86_64) arch=amd64 ;;
            aarch64 | arm64) arch=arm64 ;;
          esac
          base="https://github.com/golangci/golangci-lint/releases/download/v${version}"
          archive="golangci-lint-${version}-linux-${arch}.tar.gz"
          curl -sSfL "$base/$archive" | tar -xz -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$RUNNER_TEMP/golangci-lint-${version}-linux-${arch}/golangci-lint" "$HOME/.local/bin/golangci-lint"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          golangci-lint --version
      - name: bin/prime
        run: bin/prime
      - name: go.mod and go.sum are untouched
        # The lockfile guard for this repository, now that there is exactly one
        # lockfile.
        #
        # `bin/prime-go` runs `go build ./...` and `go test ./...`, and neither
        # rewrites the manifests — but a plain `go get` or a `go mod tidy` left in
        # a dependency bump would resolve a different tree than the one that was
        # committed, and the run would stay green while doing it. The Go
        # equivalent of `--frozen-lockfile` does not exist, so this is the check
        # that stands in for it: cheap, and it catches drift that is otherwise
        # invisible. The generated-code step inside `bin/prime-go` depends on
        # `api.gen.go` matching `openapi/v1.yaml`, and it uses the module cache
        # offline — so a manifest that resolved differently is a manifest the
        # regeneration step would also have disagreed about.
        run: |
          git diff --exit-code -- go.mod go.sum \
            || { echo "bin/prime moved go.mod or go.sum — the build is no longer against the committed tree"; exit 1; }
      # WAS: a second step, `bun.lock is untouched`, doing the same job for the
      # Bun lockfile via `git diff --exit-code -- bun.lock`. Removed with the
      # `setup-bun` step above, and for the same reason plus one more: a guard
      # over a file the gate no longer installs from is a check that cannot fail
      # for a reason anyone can act on. `git diff --exit-code -- bun.lock` against
      # a repository where nothing runs `bun install` is a no-op that reports
      # success, and a passing no-op in a gate file is worse than no step --
      # it reads as coverage. The `go.mod`/`go.sum` guard above is now the whole
      # of it, and it guards the whole of it.


  # ------------------------------------------------------------- the live tier
  # gateway's Redis backend is the one part of the suite that a transcription
  # cannot stand in for: `internal/ratelimit/live_test.go` runs GCRA_LUA against
  # a real redis-server, so the script itself is executed by these tests and by
  # nothing else in this repository. That tier is environment-gated, so without
  # this job it skips and the run is green without having run it.
  #
  # It WAS the TypeScript file `src/middleware/rateLimitRedisLive.test.ts`, run
  # under `bun test` after a `bun install --frozen-lockfile`. That file was
  # deleted at f87c891, so this job could not pass: `bun install` had no
  # dependency graph to install and `bun test` had no file to run. It now runs
  # the Go tier, same Redis, same port, same image pin.
  #
  # It is a separate job, and a separate service, because kit's `go` job has no
  # way to start Redis and must not grow one: a reusable workflow that brought up
  # a datastore would be a reusable workflow that decides what every service in
  # the org needs. gateway's counter store is gateway's dependency.
  #
  # `GATEWAY_REDIS_REQUIRED` is the load-bearing part, and its value is corrected
  # from `"true"` to `"1"`. It was `"true"`, and `TestMain` compares
  # `os.Getenv("GATEWAY_REDIS_REQUIRED") == "1"` -- so the flag this job has been
  # setting was read as UNSET, every run, since it was written. The tier skipped
  # silently on a runner where the URL was unusable, and the run stayed green.
  # This is the same class of defect as the equivalence flag, arrived at from the
  # other direction: a gate variable whose value is a string nothing ever parses.
  #
  # Which is why the job also asserts on the run's own output rather than
  # trusting the flag. The tier skips when GATEWAY_REDIS_URL is unset, and a skip
  # is a green run that verified nothing -- the failure this job exists to
  # prevent. Setting the required flag turns "no Redis" from a skip into a
  # failure, and the step below turns "ran and passed" from an assumption into a
  # count. Either alone is half the guarantee.
  redis:
    name: redis (live tier)
    runs-on: ubuntu-latest
    # 10, and not GitHub's 360-minute default: fourteen live tests against a
    # service-container Redis — seconds of test behind a setup-go.
    timeout-minutes: 10
    services:
      redis:
        # Pinned, never `latest`: the script's arithmetic is the thing under
        # test, and it must be the same Redis on every run. 7.4 is the oldest
        # series with the RESP2/Lua behaviour `parseReply` and `connectRedis`
        # assume, so a 7.x bump is the safe direction.
        image: redis:7.4.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: the live tier runs
        env:
          GATEWAY_REDIS_URL: redis://127.0.0.1:6379
          GATEWAY_REDIS_REQUIRED: "1"
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/live-tier.log"
          # The tier is SELECTED BY NAME, and the names come out of the file that
          # declares them. Two reasons, and the second is the real one.
          #
          # First: `./internal/ratelimit/` on its own runs 57 tests, not 14. The
          # package holds the transcription tests as well as the live ones, and a
          # floor checked against a package total is a floor that drifts upward
          # every time somebody adds a unit test elsewhere in the file -- so it
          # stops being a statement about this tier and becomes a statement about
          # the package. Measured on go1.26.1: 57 `--- PASS` for the package,
          # 14 for the tier.
          #
          # Second, and the reason this reads the source at all: a hardcoded list
          # of fourteen names is a list that is wrong the day someone adds a
          # fifteenth test, and it is wrong SILENTLY -- the new test runs, is not
          # in the pattern, and the floor still passes on the fourteen it knows.
          # Reading `^func Test` out of live_test.go means the thing being
          # selected and the thing being counted are the same list by
          # construction.
          #
          # `TestMain` matches the same `^func Test` pattern and is excluded
          # explicitly, because `-run TestMain` is not a test and Go treats a
          # `-run` match on it as an error rather than a filter.
          pattern=''
          declared=0
          while read -r t; do
            [ "$t" = "TestMain" ] && continue
            declared=$((declared + 1))
            if [ -n "$pattern" ]; then pattern="$pattern|$t"; else pattern="$t"; fi
          done < <(grep -oE '^func Test[A-Za-z0-9_]+' internal/ratelimit/live_test.go | sed 's/^func //')
          echo "live tests declared in internal/ratelimit/live_test.go: $declared"
          # A tier whose selector matched nothing is a step that cannot fail, so
          # the empty pattern is refused here rather than handed to `go test`,
          # where `^()$` is a valid regex matching nothing and the run is green.
          if [ -z "$pattern" ]; then
            echo "::error::no test names were read out of internal/ratelimit/live_test.go." >&2
            echo "::error::An empty -run pattern is a green run of zero tests." >&2
            exit 1
          fi
          go test -count=1 -v -run "^($pattern)\$" ./internal/ratelimit/ 2>&1 | tee "$log"
          # `pipefail` is already on, but the exit status is read explicitly
          # rather than inherited: under pipefail the pipeline's status IS go
          # test's, and a step that reports tee's status is a gate that can
          # never fail.
          exit "${PIPESTATUS[0]}"
      - name: the live tier reported passes, not skips
        # The property, unchanged: a green `go test` on a tier that ran nothing is
        # not a pass. `go test` exits 0 on a package whose tests all skipped, so
        # the run step being green is not evidence on its own -- and the run step
        # CAN be green that way, because `GATEWAY_REDIS_REQUIRED` only escalates
        # when the URL is also unset (see the two conditions in TestMain). A
        # reachable-but-degraded Redis, or a typo in the URL that still resolves,
        # skips rather than fails.
        #
        # RE-DERIVED FOR `go test -v`. The old assertion parsed `bun test`'s
        # summary block (`^ *N pass *$`). That shape does not exist in Go: go
        # test prints one `--- PASS: Name (0.00s)` line per test and no trailing
        # count of passes at all. So the count comes from counting those lines,
        # anchored whole-line with a colon and a space, which is what makes
        # `--- PASS:` distinct from the `    --- PASS:` that subtests and
        # benchmarks print indented. Counting `PASS` as a substring would count
        # those too and inflate the floor past its own meaning.
        #
        # `grep -c` under pipefail exits 1 when it counts ZERO, which is the case
        # this step exists to catch -- so `|| true` is there to let the zero
        # through to the comparison rather than aborting on it. Without it the
        # step fails for the right reason by accident and says nothing.
        env:
          GATEWAY_REDIS_URL: redis://127.0.0.1:6379
          GATEWAY_REDIS_REQUIRED: "1"
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/live-tier.log"
          # MEASURED, not carried forward. live_test.go declares 15 `func Test`
          # names; one of them is `TestMain`, which is not a test. So the tier is
          # 14 -- which is the number the old `-lt 14` happened to state, and it
          # is stated here again only because it was re-measured against
          # go1.26.1 against a real redis-server rather than inherited.
          #
          # One of those 14 is `TestAnUnreachableServerThrowsRatherThanResolving`,
          # which runs with the tier GATED OFF on purpose -- it asserts that an
          # unreachable server throws rather than resolving, so it needs no
          # server. That is why an ungated run below reports 1 pass and 13 skips
          # and not 0 and 13: the floor is a statement about the tier, and the
          # ungated run is measured below it, which is the intended failure.
          floor=14
          passed="$(grep -cE '^--- PASS: ' "$log" || true)"
          skipped="$(grep -cE '^--- SKIP: ' "$log" || true)"
          echo "passed=$passed skipped=$skipped floor=$floor"
          if [ "$passed" -lt "$floor" ]; then
            echo "::error::the live Redis tier reported $passed passes; the floor is $floor." >&2
            echo "::error::A tier that did not run is not a pass. Either Redis was" >&2
            echo "::error::unreachable -- in which case nothing above says so -- or the" >&2
            echo "::error::tests moved out of live_test.go, in which case lower this" >&2
            echo "::error::floor in the same commit as the move." >&2
            exit 1
          fi
          if [ "$skipped" -ne 0 ]; then
            echo "::error::the live Redis tier skipped $skipped of its tests; CI is" >&2
            echo "::error::the only place it can be forced, and it was not forced." >&2
            exit 1
          fi
          echo "live Redis tier: $passed passed, $skipped skipped"

  # ------------------------------------------------------------------ manifest
  # `cafaye.yml` is `additionalProperties: false` against core's frozen schema, so
  # a field core does not define is a validation failure rather than a comment —
  # and core is the only repository that knows which fields those are. The schema
  # is fetched rather than vendored so this tracks what core publishes today
  # instead of freezing a copy that silently goes stale.
  #
  # This cannot live in kit: it reaches into `cafaye/core`, and kit's own scope
  # rule is that a step reaching into another cafaye repository is deliberately
  # out of it.
  manifest:
    name: manifest
    runs-on: ubuntu-latest
    # 10, and not GitHub's 360-minute default: one curl, one pip install, one
    # schema validation — about a minute's work.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: cafaye.yml validates against core's schema
        run: |
          curl -fsSL -o cafaye.manifest.schema.json \
            https://raw.githubusercontent.com/cafaye/core/master/schemas/cafaye.manifest.schema.json
          python3 -m pip install --quiet --disable-pip-version-check jsonschema pyyaml
          python3 - <<'PY'
          import json
          import jsonschema, yaml

          schema = json.load(open("cafaye.manifest.schema.json"))
          manifest = yaml.safe_load(open("cafaye.yml"))
          jsonschema.validate(manifest, schema)
          print("cafaye.yml validates against core's manifest schema")
          PY

  # --------------------------------------------------------------------- image
  # gateway ships a Dockerfile, and a Dockerfile that does not build ships
  # unverified. kit's lint tier does not cover Dockerfiles, so this is gateway's.
  # It runs two independent things, and the second is not a third test run:
  # `docker build --target test` executes the suite inside the image, which is a
  # different tree from the one the host ran in.
  image:
    name: image
    runs-on: ubuntu-latest
    # 30, and not GitHub's 360-minute default: two docker builds with the suite
    # running inside the test stage — the slowest job this file owns, still
    # minutes on a warm cache, so 30 bounds the hang without touching health.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: the Dockerfile is lint-clean
        # Not skipped, and not left to review. kit-04 found seven Dockerfiles
        # receiving no lint at all, and hadolint is the obvious candidate — so
        # this job is what makes gateway's one of the linted rather than one of the
        # seven.
        run: |
          docker run --rm -i \
            -v "$PWD:/work:ro" \
            hadolint/hadolint:v2.12.0-debian \
            hadolint --failure-threshold warning /work/Dockerfile
      - name: the suite passes inside the image
        # `docker compose build` builds the runtime target only, so it does not
        # execute the test stage — buildkit skips a stage the target does not
        # depend on. Naming the target is the whole point.
        run: docker build --target test --tag cafaye-gateway:test .
      - name: the image ran the repository's tests, not a subset of them
        # The step above is a green build, and a green build is a claim about a
        # file set nobody in this job has read. It used to name its own evidence:
        # `docker build --target test` reported 392 tests across 15 files while the
        # host ran 399 across 16, because `pins.test.ts` sits at the repository
        # root and the test stage's COPY list never named it -- so the one test
        # checking that image and repository agreed on the toolchain pin was not
        # in the image that ran. Both numbers are TypeScript-tree numbers and the
        # file is gone; see the note below for what replaced that sentence.
        #
        # This step is the half that cannot be argued with: the image is asked what
        # test files it actually holds, and that set is compared against what
        # `find` says the repository has. It reads the built image rather than the
        # Dockerfile, so it also catches a `.dockerignore` rule that drops a
        # directory out of the build context — buildkit copies the rest and stays
        # green, which no amount of reading the Dockerfile would reveal.
        #
        # IT IS NOW THE ONLY HALF, and that is why it is not optional. The Go
        # test stage copies the whole context (`COPY . .`), because `go test ./...`
        # finds a package by walking the tree and a named list of paths would be a
        # subset somebody maintains by hand. That removed the half that read the
        # Dockerfile's COPY list locally — with nothing to read, `COPY . .` is not a
        # tautology here, it is the only spelling that lets the suite be the tree —
        # and so this diff is what stands between a green build and a green build
        # that never ran a test file the repository has.
        #
        # THE STEP ITSELF IS STILL RIGHT, and it was read rather than assumed. It
        # counts `*_test.go` on both sides, asks the built image what it holds
        # rather than reading the Dockerfile's COPY list, and diffs the two sets.
        # All three properties hold for the Go tree, and the third is the one that
        # matters: `COPY . .` is not a tautology when the check reads the IMAGE,
        # because a `.dockerignore` rule that drops a directory leaves buildkit
        # copying the rest and staying green. Reading the Dockerfile could not see
        # that; `docker run ... find` can.
        #
        # WHAT WAS HERE, and it described a file that no longer exists: this
        # comment block explained that `pins.test.ts` sits at the repository root
        # and the test stage's COPY list never named it, so the image ran 392
        # tests across 15 files where the host ran 399 across 16. That was a real
        # finding about the TypeScript tree. `pins.test.ts` was deleted at
        # f87c891 along with `test/`, and with it the only test file that lived
        # outside a test directory -- so the specific gap this step was written to
        # catch no longer exists.
        #
        # The check is kept anyway, and the reason is worth stating because it is
        # the difference between a check and a relic. The property is not "the
        # image holds pins.test.ts"; it is "the image holds every test file the
        # repository has". The first instance of that property was about one
        # file, and this is about all of them. A check that has lost its original
        # subject is still measuring the thing it was written to measure.
        #
        # Counting files and not tests, deliberately. The live Redis tier skips in
        # here by design, so the pass count legitimately differs from a host run
        # that has Redis; the file count cannot. `*_test.go` and not `*.test.ts`:
        # the two are disjoint sets, and the TypeScript suite is not in this image.
        # The `-not -path './node_modules/*'` exclusion is likewise now historical
        # -- there is no node_modules in this image -- and is kept because it is
        # correct for the case where one is present, which is the only case it
        # costs anything in.

        run: |
          set -o pipefail
          in_image="$(docker run --rm --entrypoint /bin/sh cafaye-gateway:test -c \
            "find . -name '*_test.go' | sed 's|^\./||' | sort -u")"
          repository="$(find . -name '*_test.go' -not -path './node_modules/*' -not -path './.git/*' \
            | sed 's|^\./||' | sort -u)"
          if [ -z "$in_image" ]; then
            echo "the image reported no test files at all — it ran nothing, or the report is gone"
            exit 1
          fi
          if [ "$in_image" != "$repository" ]; then
            echo "the image's test files and the repository's disagree:"
            diff <(printf '%s\n' "$repository") <(printf '%s\n' "$in_image") || true
            exit 1
          fi
          echo "image and repository agree on $(printf '%s\n' "$in_image" | wc -l | tr -d ' ') test files"
      - name: the runtime image builds
        # MOVED UP, and this was a real ordering bug rather than tidiness.
        # `docker compose build` is what puts the tag `cafaye/gateway:dev` in the
        # local image store -- compose reads `image:` off the `gateway` service,
        # and that line in docker-compose.yml says `cafaye/gateway:dev`. This step
        # used to be LAST, after the step that creates a container from that very
        # tag. `docker create` does not pull and does not build: on a runner where
        # nothing has produced the tag, it fails with "Unable to find image ...
        # locally", so the job was red and the failure named a missing image
        # rather than the missing build.
        #
        # It has to stay ahead of the test-stage steps too? No -- and that is worth
        # being precise about, because the two look related. `docker build
        # --target test --tag cafaye-gateway:test .` and `docker compose build`
        # are separate builds with separate tags. The test steps read
        # `cafaye-gateway:test`; only the contents check below reads
        # `cafaye/gateway:dev`. So the only ordering constraint is that this
        # precedes the contents check, and it is placed immediately before it.
        run: docker compose build
      - name: the shipped image carries the binary and nothing else of ours
        # `test/dockerStage.test.ts` asserted that the runtime stage copies no test
        # tree. That assertion retired with the rest of that file — there is no COPY
        # list to hold to any more — and this is the property, checked against the
        # image rather than against the file describing it.
        #
        # `docker export` lists the whole flattened filesystem and needs nothing
        # inside the container to cooperate, which is what makes it the right tool
        # here: this image is distroless, so there is no shell to run a command in
        # and no `find` to run one with. What must not be in the list is any path
        # from the repository — `src/`, `test/`, a `.go` file, a `.ts` file, the
        # doubles.
        #
        # ANCHORED AT THE ROOT, and not `(src|test)/` anywhere: distroless has its
        # own empty `/bin/` and a `/usr/src/`, and the first version of this pattern
        # reported both as leaks — which is a check that fires on the base image and
        # teaches its reader to ignore it. `^bin/.` asks for an ENTRY under `bin/`,
        # which is the difference between distroless's empty directory and the
        # repository's `bin/` of gate scripts.
        run: |
          set -o pipefail
          probe="$(docker create --name gateway-image-contents cafaye/gateway:dev)"
          docker export "$probe" | tar -tf - | sort > /tmp/image-paths.txt
          docker rm "$probe" >/dev/null
          ours="$(grep -E '^(src|test|internal|cmd|openapi)/|^bin/.|_test\.go$|\.ts$|\.go$' /tmp/image-paths.txt || true)"
          if [ -n "$ours" ]; then
            echo "the shipped image carries repository paths:"
            printf '%s\n' "$ours"
            exit 1
          fi
          grep -qx 'app/service' /tmp/image-paths.txt || {
            echo "the shipped image has no /app/service — it is not the gateway"
            exit 1
          }
          echo "the image carries app/service and $(wc -l < /tmp/image-paths.txt | tr -d ' ') base files, and none of ours"
