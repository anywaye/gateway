---
# The CI path for gateway.
#
# The shared half is kit's reusable workflow: one `uses:` line, and a fix to the
# toolchain or the linter reaches this repository on its next run without a PR
# here. The `.github/workflows/` in that path is not decoration — GitHub resolves
# a reusable workflow at `{owner}/{repo}/.github/workflows/{file}@{ref}` and
# documents that subdirectories of the workflows directory are not supported, so
# `cafaye/kit/workflows/ci.reusable.yml@master` resolves to nothing. kit-04 is
# landing that move in parallel with this packet; until it merges, this file
# points at a path that does not exist yet on `master` and the `ci` job is
# red. That is stated rather than worked around: a workflow quietly rewritten to
# a path that resolves is a workflow nobody reviewed.
#
# The jobs below it are gateway's, and each one is here because kit cannot own it.
# kit holds conventions; these reach into this repository's own shape.
#
# No secrets, no cafaye service is contacted, nothing is published. Release work
# is a separate workflow so a red test can never publish.
name: ci

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `GATEWAY_EQUIVALENCE_REQUIRED` is read by `internal/equivalence` and turns
# "bun is not on PATH" from a skip into a failure at module load. It is here and
# only here for the same reason the Redis job sets
# `GATEWAY_REDIS_REQUIRED=true`: a skip nobody can see is a green run that
# verified nothing, and this repository has been bitten by that twice — once on
# the Redis tier and once by `docker build --target test` running 392 tests
# across 15 files where the host ran 399 across 16.
#
# It is a JOB-level env rather than a step-level one because `bin/prime` now runs
# the Go tier itself, and the equivalence check is inside it. There is deliberately
# no `prime-go` job: two jobs running two tiers would be the gate existing twice,
# and the two could disagree about what "the Go tier is green" means.
env:
  GATEWAY_EQUIVALENCE_REQUIRED: "1"

jobs:
  # -------------------------------------------------------------- shared half
  # `language: bun` runs install (frozen), typecheck and test. It is the same
  # work `bin/prime` does, from kit's copy of the conventions, which is the point
  # of calling it rather than maintaining a second version here.
  ci:
    name: ci (kit)
    uses: cafaye/kit/.github/workflows/ci.reusable.yml@master
    with:
      language: bun
      working-dir: .
      # The pin, passed rather than defaulted. kit falls back to 1.3.12, which
      # happens to be the same number today — and a default that happens to match
      # is a default nobody is checking. `src/pins.test.ts` asserts this against
      # package.json, mise.toml, the Dockerfile and compose, so a bump in any of
      # them fails the gate rather than quietly testing one runtime and shipping
      # another.
      versions: '{"bun":"1.3.12"}'

  # ------------------------------------------------- the gate a developer runs
  # Done means `bin/prime` is the gate and it is the same command locally and in
  # CI. kit's `bun` job is the same *steps*, but not the same command: a gate
  # nobody runs is a gate nobody maintains, and this job is what keeps that true.
  # It also carries the lockfile guard, which has to run *after* an install and
  # so cannot live inside kit's job.
  prime:
    name: bin/prime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      # `go-version-file: go.mod` rather than a literal version, and that is the
      # point: the pin now lives in `go.mod` (which the compiler enforces) and in
      # `mise.toml` (which `bin/prime-go`'s first step checks against it), and a
      # literal here would be a FOURTH copy for CI to disagree with. Two copies,
      # one of them checked by the gate at startup — the arrangement
      # `pantry/.github/workflows/ci.yml:35` states the same way.
      #
      # The step order matters and it is not alphabetical: `setup-bun` before
      # `setup-go` is irrelevant, but `setup-go` must come before `bin/prime`,
      # because `bin/prime` now ends in `./bin/prime-go` and that script exits 127
      # on a machine with no Go toolchain rather than skipping.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: bin/prime
        run: bin/prime
      - name: go.mod and go.sum are untouched
        # The Go half of the check the next step does for `bun.lock`.
        #
        # `bin/prime-go` runs `go build ./...` and `go test ./...`, and neither
        # rewrites the manifests — but a plain `go get` or a `go mod tidy` left in
        # a dependency bump would resolve a different tree than the one that was
        # committed, and the run would stay green while doing it. The Go
        # equivalent of `--frozen-lockfile` does not exist, so this is the check
        # that stands in for it: cheap, and it catches drift that is otherwise
        # invisible. The generated-code step inside `bin/prime-go` depends on
        # `api.gen.go` matching `openapi/v1.yaml`, and it uses the module cache
        # offline — so a manifest that resolved differently is a manifest the
        # regeneration step would also have disagreed about.
        run: |
          git diff --exit-code -- go.mod go.sum \
            || { echo "bin/prime moved go.mod or go.sum — the build is no longer against the committed tree"; exit 1; }
      - name: the equivalence tier compared something, and said how much
        # The env var above turns "bun is not on PATH" into a failure, so a green
        # run of `bin/prime` in this job means the reference was stood up and the
        # comparison count on the last line below is a number of real answers.
        # This step is the CLAIM made legible: it reads that count out of the run's
        # own output and holds it to four things — that the line is there, that the
        # per-scenario rows agree with it, that the rows' own arithmetic produces it,
        # and that it has not shrunk.
        #
        # It is a second assertion on the same evidence rather than a third
        # mechanism, and the redundancy is the point — `gate.yml` deliberately
        # cannot put a floor on that count (a legitimate developer machine without
        # bun never prints the line), so the only place the count is held to a
        # number is here, where `GATEWAY_EQUIVALENCE_REQUIRED=1` guarantees it is
        # printed at all.
        #
        # WHAT CHANGED, AND WHY THE OLD VERSION WAS DEAD IN BOTH DIRECTIONS
        #
        # It compared against a literal 72, which was correct when the tier compared
        # 6 cases. The tier now compares 51 cases across 13 scenarios = 912
        # comparisons, so a floor of 72 passed for every outcome the tier has ever
        # produced and for every regression between 72 and 911. A check that cannot
        # fail is not a check.
        #
        # It was WORSE than that, and this was measured before it was changed: the
        # `sed` matched `cases x \([0-9]+\) scenarios`, and the tier has printed
        # `cases ACROSS` since 5947d8f — the commit that made the browser half a
        # function of the scenario, which turned the count from a product into a
        # sum. The pattern matched nothing, so `comparisons` was empty and the step
        # exited on its "printed no comparison count" branch before reaching the
        # floor. The guard was red on every green run and had been for a while, and
        # the red was being read as the known-red kit job rather than as this one.
        # So the parser is now checked against the string the runner actually
        # prints, and — see below — the count is checked against a SECOND tally of
        # the same run rather than against one number that a reworded `t.Logf`
        # can take away entirely.
        run: |
          set -o pipefail

          # The gate's exit status is captured HERE, before any of its numbers are
          # read, and the numbers are discarded if it failed. A partial run still
          # prints a summary line, so a count from a red `bin/prime-go` would be a
          # count of half a comparison.
          #
          # IN AN `if`, and that is not a style preference. Actions runs a `run:`
          # block as `bash --noprofile --norc -eo pipefail {0}`, and under `-e` a
          # bare `summary="$(bin/prime-go 2>&1)"` ABORTS the step the moment the
          # gate fails: the step would die on that line with the gate's own status
          # and print nothing at all. The previous version of this step had exactly
          # that shape, so a failing gate was a red with no sentence attached. Found
          # by running this block against a stub that fails, under the same shell
          # Actions uses — reading the code would not have shown it.
          if summary="$(bin/prime-go 2>&1)"; then
            gate_exit=0
          else
            gate_exit=$?
          fi
          echo "$summary"

          # `gate_exit` AND NOT `gate-exit`: bash does not accept a hyphen in a
          # variable name, so `gate-exit=$?` is a command lookup that fails with
          # 127 — under `-e` the step dies on that line before it has checked
          # anything, and without `-e` it dies on the next one instead, because
          # `$gate-exit` expands to the empty `$gate` followed by the literal
          # `-exit`. Found by the same harness: a name that cannot be assigned
          # looks exactly like a name that holds zero.
          if [ "$gate_exit" -ne 0 ]; then
            echo "bin/prime-go exited $gate_exit, so the counts below would describe a run that failed."
            echo "  They are not evidence that anything was compared."
            exit "$gate_exit"
          fi

          # `across`, and not `x`: that is the previous version's failure, and the
          # runner stopped saying `x` when the browser half became a function of
          # the scenario and the count stopped being a product. The `.*` before
          # `equivalence:` is carried forward rather than reinvented — `go test -v`
          # prefixes a log line with `    file.go:403: `, so an anchored pattern
          # matches nothing, which is what the first draft of this step did.
          summary_line="$(printf '%s\n' "$summary" |
            sed -n 's/.*equivalence: \([0-9][0-9]*\) cases across \([0-9][0-9]*\) scenarios = \([0-9][0-9]*\) comparisons.*/\1 \2 \3/p' |
            tail -n 1)"
          if [ -z "$summary_line" ]; then
            echo "the equivalence tier printed no comparison count; a check that cannot say what it compared is a check that cannot be read"
            exit 1
          fi
          cases="$(printf '%s' "$summary_line" | cut -d' ' -f1)"
          scenarios="$(printf '%s' "$summary_line" | cut -d' ' -f2)"
          comparisons="$(printf '%s' "$summary_line" | cut -d' ' -f3)"

          # THE PER-SCENARIO ROWS: the same run, counted a second way.
          #
          # `comparisons` is incremented once per comparison inside the loop;
          # `asked` is incremented once per case in the same loop, and printed as
          # one row per scenario. Two tallies of one run that cannot both be right
          # unless the runner compared what it says it compared — which is the
          # property the floor below cannot have on its own, because the floor is a
          # number and this is arithmetic that moves with the cases.
          rows="$(printf '%s\n' "$summary" |
            sed -n 's/.*equivalence: scenario \([A-Za-z0-9]*\) *\([0-9][0-9]*\) case(s) asked.*/\1 \2/p')"
          row_count="$(printf '%s\n' "$rows" | grep -c '[^[:space:]]' || true)"
          if [ "$row_count" -ne "$scenarios" ]; then
            echo "the summary claims $scenarios scenarios and the run printed $row_count per-scenario rows."
            echo "  One of the two is a number this step read rather than counted, so the floor"
            echo "  below would be held against a count nothing else in the run corroborates."
            exit 1
          fi

          asked_total=0
          asked_nothing=""
          while read -r name asked; do
            [ -n "$name" ] || continue
            asked_total=$((asked_total + asked))
            if [ "$asked" -eq 0 ]; then
              asked_nothing="$asked_nothing $name"
            fi
          done <<<"$rows"
          if [ -n "$asked_nothing" ]; then
            echo "scenario(s)$asked_nothing asked no case at all, so every comparison under them"
            echo "  passed vacuously. The runner asserts this too; this step reads the rows it"
            echo "  now depends on, so it cannot depend on a row set that is allowed to be empty."
            exit 1
          fi

          # TWO COMPARISONS PER ASKED CASE, and this is the whole derivation: the
          # loop compares the FIRST request of a burst and the LAST one, and counts
          # each (`comparisons++` appears twice in `equivalence_test.go`, `asked++`
          # once). It is a number about the tier's SHAPE rather than about its case
          # list, so it does not need raising when a case is added — and a change
          # to the burst comparison is a change to this, which the failure below
          # says out loud.
          comparisons_per_case=2
          expected=$((asked_total * comparisons_per_case))
          if [ "$comparisons" -ne "$expected" ]; then
            echo "the tier reported $comparisons comparisons; its own per-scenario rows add up to"
            echo "  $expected ($asked_total cases asked x $comparisons_per_case comparisons each)."
            echo "  Those are two counts of the same loop, so one of them is wrong. If the runner"
            echo "  compares more or fewer than the first and last request of a burst, fix"
            echo "  comparisons_per_case above in this commit rather than loosening the equality."
            exit 1
          fi

          # THE FLOOR, AND WHY IT IS A NUMBER RATHER THAN A DERIVATION
          #
          # Every quantity above is produced by the run whose case list shrank: the
          # summary's cases, its scenarios, its comparisons and its per-scenario
          # rows all come from the same execution, so they shrink together and
          # agree with each other. NO WITHIN-RUN QUANTITY CAN SEE SHRINKAGE, and
          # the scenario inventory cannot substitute for one — the two arms are
          # held equal by `TestTheInventoryIsEveryScenarioBothSidesDeclareAndNothing
          # Twice`, so a run that drove fewer scenarios than the last one is caught
          # there, but a run that drove all thirteen over a case list with three
          # fewer cases in it is not, and that is the regression this floor is for.
          #
          # So the cross-run half needs a recorded number, and this file is where it
          # is recorded. What makes that survivable — and what the old literal was
          # not — is that it is a FLOOR and nothing else. The 72 was not a floor
          # that had stopped being true; it was a number that had to be RAISED every
          # time a case was added, and `b7dff5b` alone took the tier from 405 to
          # 912, so it rotted by never being raised. A floor is never wrong by
          # being too low as long as it fires — it is only ever too high, and being
          # too high is a loud red the author can see. Additions pass it without
          # touching this file; only a removal can fail it.
          #
          # SHRINKAGE, NOT ANY CHANGE — deliberately. `b7dff5b` added two scenarios
          # and the limiter work adds cases inside an existing one, so a guard that
          # fired on every change would fire on every legitimate packet and get
          # deleted rather than fixed. The property worth holding is the count going
          # DOWN. When it goes down legitimately, the author lowers this number in
          # the same commit that removed the case, which puts the removal on the
          # record in the diff rather than in a comment nobody reads.
          floor=912
          if [ "$comparisons" -lt "$floor" ]; then
            echo "the equivalence tier compared $comparisons request/case pairs and this floor says $floor."
            echo "  Its own rows agree: $asked_total cases asked across $scenarios scenarios."
            echo
            echo "  If a commit in this range REMOVED a case or a scenario, lower the floor in"
            echo "  that same commit so the removal is in the diff. If nothing was removed, this"
            echo "  is unexplained shrinkage and the guard is the only thing that saw it."
            exit 1
          fi

          echo "equivalence: $comparisons comparisons over $asked_total cases asked across $scenarios scenarios (floor $floor), every one of them answered identically by both sides"
      - name: bun.lock is untouched
        # `bin/prime` runs `bun install --frozen-lockfile`, which fails rather
        # than rewriting the lock — so this is expected to be a no-op, and that is
        # exactly why it is here. It is the check that survives a future edit to
        # bin/prime that drops the flag: a plain `bun install` will happily
        # resolve a different tree than the one that was committed, and the run
        # stays green while doing it. Cheap, and it catches drift that is
        # otherwise invisible.
        run: |
          git diff --exit-code -- bun.lock \
            || { echo "bin/prime moved bun.lock — the gate is no longer frozen"; exit 1; }

  # ------------------------------------------------------------- the live tier
  # gateway's Redis backend is the one part of the suite that a transcription
  # cannot stand in for: `rateLimitRedis.test.ts` runs a JavaScript copy of
  # GCRA_LUA, so the script itself has never been executed by any test in this
  # repository. That tier is environment-gated on a real redis-server, so without
  # this job it skips and the run is green without having run it.
  #
  # It is a separate job, and a separate service, because kit's bun job has no
  # way to start Redis and must not grow one: a reusable workflow that brought up
  # a datastore would be a reusable workflow that decides what every service in
  # the org needs. gateway's counter store is gateway's dependency.
  #
  # `GATEWAY_REDIS_REQUIRED=true` is the load-bearing part. The tier skips when
  # GATEWAY_REDIS_URL is unset, and a skip is a green run that verified nothing —
  # the failure this packet exists to prevent. Setting the required flag turns
  # "no Redis" from a skip into a failure, so this job cannot pass without having
  # executed the script.
  redis:
    name: redis (live tier)
    runs-on: ubuntu-latest
    services:
      redis:
        # Pinned, never `latest`: the script's arithmetic is the thing under
        # test, and it must be the same Redis on every run. 7.4 is the oldest
        # series with the RESP2/Lua behaviour `parseReply` and `connectRedis`
        # assume, so a 7.x bump is the safe direction.
        image: redis:7.4.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - name: install
        run: bun install --frozen-lockfile
      - name: the live tier runs
        env:
          GATEWAY_REDIS_URL: redis://127.0.0.1:6379
          GATEWAY_REDIS_REQUIRED: "true"
        run: bun test src/middleware/rateLimitRedisLive.test.ts
      - name: the live tier reported passes, not skips
        # `bun test` exits 0 on a fully skipped file, so a green step above is
        # not by itself evidence that the tier ran. This reads the summary and
        # fails on the shape that verifies nothing: `0 pass` and everything
        # skipped. It is the difference between a checkmark and a claim, and
        # PLAN.md §1 is explicit that a skipped test proves nothing.
        env:
          GATEWAY_REDIS_URL: redis://127.0.0.1:6379
          GATEWAY_REDIS_REQUIRED: "true"
        run: |
          summary="$(bun test src/middleware/rateLimitRedisLive.test.ts 2>&1)"
          echo "$summary"
          # `bun test` prints one count per line, so these are anchored whole-line
          # matches rather than the substring grep that reads fine until the
          # output has a second `pass` in it.
          passed="$(printf '%s\n' "$summary" | sed -n 's/^ *\([0-9][0-9]*\) pass *$/\1/p' | tail -n 1)"
          skipped="$(printf '%s\n' "$summary" | sed -n 's/^ *\([0-9][0-9]*\) skip *$/\1/p' | tail -n 1)"
          if [ "${passed:-0}" -lt 14 ]; then
            echo "the live Redis tier ran ${passed:-0} tests, expected 14 — a tier that did not run is not a pass"
            exit 1
          fi
          if [ "${skipped:-0}" -ne 0 ]; then
            echo "the live Redis tier skipped $skipped tests; CI is the only place it can be forced"
            exit 1
          fi
          echo "live Redis tier: $passed passed, ${skipped:-0} skipped"

  # ------------------------------------------------------------------ manifest
  # `cafaye.yml` is `additionalProperties: false` against core's frozen schema, so
  # a field core does not define is a validation failure rather than a comment —
  # and core is the only repository that knows which fields those are. The schema
  # is fetched rather than vendored so this tracks what core publishes today
  # instead of freezing a copy that silently goes stale.
  #
  # This cannot live in kit: it reaches into `cafaye/core`, and kit's own scope
  # rule is that a step reaching into another cafaye repository is deliberately
  # out of it.
  manifest:
    name: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: cafaye.yml validates against core's schema
        run: |
          curl -fsSL -o cafaye.manifest.schema.json \
            https://raw.githubusercontent.com/cafaye/core/master/schemas/cafaye.manifest.schema.json
          python3 -m pip install --quiet --disable-pip-version-check jsonschema pyyaml
          python3 - <<'PY'
          import json
          import jsonschema, yaml

          schema = json.load(open("cafaye.manifest.schema.json"))
          manifest = yaml.safe_load(open("cafaye.yml"))
          jsonschema.validate(manifest, schema)
          print("cafaye.yml validates against core's manifest schema")
          PY

  # --------------------------------------------------------------------- image
  # gateway ships a Dockerfile, and a Dockerfile that does not build ships
  # unverified. kit's lint tier does not cover Dockerfiles, so this is gateway's.
  # It runs two independent things, and the second is not a third test run:
  # `docker build --target test` executes the suite inside the image, which is a
  # different tree from the one the host ran in.
  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: the Dockerfile is lint-clean
        # Not skipped, and not left to review. kit-04 found seven Dockerfiles
        # receiving no lint at all, and hadolint is the obvious candidate — so
        # this job is what makes gateway's one of the linted rather than one of the
        # seven.
        run: |
          docker run --rm -i \
            -v "$PWD:/work:ro" \
            hadolint/hadolint:v2.12.0-debian \
            hadolint --failure-threshold warning /work/Dockerfile
      - name: the suite passes inside the image
        # `docker compose build` builds the runtime target only, so it does not
        # execute the test stage — buildkit skips a stage the target does not
        # depend on. Naming the target is the whole point.
        run: docker build --target test --tag cafaye-gateway:test .
      - name: the image ran the repository's tests, not a subset of them
        # The step above is a green build, and a green build is a claim about a
        # file set nobody in this job has read. `docker build --target test`
        # reported 392 tests across 15 files while the host ran 399 across 16:
        # `pins.test.ts` sits at the repository root and the test stage's COPY
        # list never named it, so the one test that checks the image and the
        # repository agree on the toolchain pin was not in the image that ran.
        #
        # `test/dockerStage.test.ts` holds the COPY list to the repository and
        # fails the build locally when they disagree. This step is the other
        # half, and it is the half that cannot be argued with: the suite emits
        # every test file it actually discovered (the `GATEWAY_IMAGE_TEST` lines),
        # and this compares that set against what `find` says the repository
        # has. It reads the built image rather than the Dockerfile, so it also
        # catches a `.dockerignore` rule that drops a directory out of a
        # `COPY src ./src` — buildkit copies the rest of the directory and stays
        # green, which no amount of reading the Dockerfile would reveal.
        #
        # Counting files and not tests, deliberately. The live Redis tier skips
        # in here by design, so the pass count legitimately differs from a host
        # run that has Redis; the file count cannot.
        run: |
          set -o pipefail
          docker run --rm --entrypoint bun cafaye-gateway:test test 2>&1 | tee /tmp/in-image.log >/dev/null
          grep -E '^ *[0-9]+ (pass|skip|fail)$|^Ran [0-9]+ tests' /tmp/in-image.log || true
          in_image="$(sed -n 's/^GATEWAY_IMAGE_TEST //p' /tmp/in-image.log | sort -u)"
          repository="$(find . -name '*.test.ts' -not -path './node_modules/*' -not -path './.git/*' \
            | sed 's|^\./||' | sort -u)"
          if [ -z "$in_image" ]; then
            echo "the image reported no test files at all — it ran nothing, or the report is gone"
            exit 1
          fi
          if [ "$in_image" != "$repository" ]; then
            echo "the image's test files and the repository's disagree:"
            diff <(printf '%s\n' "$repository") <(printf '%s\n' "$in_image") || true
            exit 1
          fi
          echo "image and repository agree on $(printf '%s\n' "$in_image" | wc -l | tr -d ' ') test files"
      - name: the runtime image builds
        run: docker compose build
